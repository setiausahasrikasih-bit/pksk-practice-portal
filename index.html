  function renderQuota(){
    const summary=currentSummary();
    document.querySelector('#set-total').textContent=`${summary.total} / ${Number(draft.expectedQuestionCount||100)}`;
    document.querySelector('#set-quota-body').innerHTML=(draft.quotas||[]).map(q=>{
      const actual=summary.subjects[q.subjectCode]||0;
      const shortage=Number(q.available||0)<Number(q.required||0);
      const complete=actual===Number(q.required||0);
      return `<tr class="${shortage?'shortage':complete?'complete':''}"><td><b>${escapeHtml(q.subjectName)}</b></td><td class="quota-number">${Number(q.required||0)}</td><td class="quota-number">${actual}</td><td><span class="availability-badge ${shortage?'short':''}">${Number(q.available||0)}${shortage?' · shortage':''}</span></td></tr>`;
    }).join('');
    document.querySelector('#set-difficulty-summary').innerHTML=Object.entries(STANDARD_DIFFICULTY_TARGET).map(([level,target])=>`<div class="difficulty-box"><span>${escapeHtml(level.replace(/^./,c=>c.toUpperCase()))}</span><b>${summary.difficulty[level]||0} / ${target}</b></div>`).join('');
  }

  function filteredCandidates(){
    const term=filters.search.toLowerCase();
    return candidates.filter(q=>{
      if(filters.subjectId&&q.subjectId!==filters.subjectId)return false;
      if(filters.difficulty&&q.difficulty!==filters.difficulty)return false;
      if(term&&!`${q.questionCode||''} ${q.promptPreview||''}`.toLowerCase().includes(term))return false;
      return true;
    });
  }
  function renderAvailable(){
    const rows=filteredCandidates();
    const summary=currentSummary();
    document.querySelector('#set-available-count').textContent=`${rows.length} shown`;
    document.querySelector('#set-available').innerHTML=rows.length?rows.map(q=>{
      const already=selected.some(x=>x.versionId===q.versionId);
      const quota=quotaFor(q.subjectCode);
      const full=quota&&(summary.subjects[q.subjectCode]||0)>=Number(quota.required||0);
      return `<article class="set-question-row"><div class="set-question-top"><div><div class="set-question-code">${escapeHtml(q.questionCode)} · v${Number(q.versionNo||1)}</div><div class="set-question-meta"><span>${escapeHtml(q.subjectName||q.subjectCode)}</span><span>${escapeHtml(q.topicName||'No topic')}</span><span>${escapeHtml(q.difficulty||'medium')}</span></div></div><button class="set-mini-btn set-add-question" data-version="${escapeHtml(q.versionId)}" ${already||full?'disabled':''}>${already?'Added':full?'Quota full':'Add'}</button></div><p class="set-question-preview">${escapeHtml(q.promptPreview||'[Question]')}</p></article>`;
    }).join(''):'<div class="empty">No published questions match these filters.</div>';
    document.querySelectorAll('.set-add-question').forEach(btn=>btn.addEventListener('click',()=>{
      const q=candidates.find(x=>x.versionId===btn.dataset.version);if(!q)return;
      const quota=quotaFor(q.subjectCode);const summary=currentSummary();
      if(quota&&(summary.subjects[q.subjectCode]||0)>=Number(quota.required||0)){showSetMessage(`${q.subjectName} quota is already full.`,'warning');return;}
      if(!selected.some(x=>x.versionId===q.versionId)){selected.push({...q,position:selected.length+1});markDirty();showSetMessage('');renderAll();}
    }));
  }
  function renderSelected(){
    document.querySelector('#set-selected').innerHTML=selected.length?selected.map((q,i)=>`<article class="set-question-row selected"><div class="set-question-top"><div><div class="set-question-code">${i+1}. ${escapeHtml(q.questionCode)} · v${Number(q.versionNo||1)}</div><div class="set-question-meta"><span>${escapeHtml(q.subjectName||q.subjectCode)}</span><span>${escapeHtml(q.difficulty||'medium')}</span></div></div><div class="set-question-actions"><button class="set-mini-btn set-selected-action" data-action="up" data-i="${i}" ${i===0?'disabled':''} aria-label="Move Up">↑</button><button class="set-mini-btn set-selected-action" data-action="down" data-i="${i}" ${i===selected.length-1?'disabled':''} aria-label="Move Down">↓</button><button class="set-mini-btn set-selected-action" data-action="remove" data-i="${i}">Remove</button></div></div><p class="set-question-preview">${escapeHtml(q.promptPreview||'[Question]')}</p></article>`).join(''):'<div class="empty">No questions selected yet. Add published questions from the Question Bank.</div>';
    document.querySelectorAll('.set-selected-action').forEach(btn=>btn.addEventListener('click',()=>{
      const i=Number(btn.dataset.i);const action=btn.dataset.action;
      if(action==='remove')selected.splice(i,1);
      if(action==='up'&&i>0)[selected[i-1],selected[i]]=[selected[i],selected[i-1]];
      if(action==='down'&&i<selected.length-1)[selected[i+1],selected[i]]=[selected[i],selected[i+1]];
      markDirty();showSetMessage('');renderAll();
    }));
  }
  function renderAll(){renderQuota();renderAvailable();renderSelected();}

  document.querySelector('#set-suggest').addEventListener('click',async e=>{
    const btn=e.currentTarget;btn.disabled=true;showSetMessage('');
    try{suggestedQuestions=await adminApi.setSuggestions(setVersionId)||[];renderSuggestionPreview();if(!suggestedQuestions.length)showSetMessage('No additional Published questions are needed or available for the remaining quotas.','warning');}
    catch(err){showSetMessage(err.message||'Unable to load Published suggestions.');}
    finally{btn.disabled=false;}
  });
  renderSuggestionPreview();

  document.querySelector('#set-search').addEventListener('input',e=>{filters.search=e.target.value.trim();renderAvailable();});
  document.querySelector('#set-subject').addEventListener('change',e=>{filters.subjectId=e.target.value;renderAvailable();});
  document.querySelector('#set-difficulty').addEventListener('change',e=>{filters.difficulty=e.target.value;renderAvailable();});
  [titleInput,descriptionInput,durationInput].forEach(el=>el.addEventListener('input',markDirty));

  async function saveSetDraft(showSuccess=false){
    showSetMessage('');
    const payload={
      setVersionId:draft.setVersionId,
      title:titleInput.value.trim(),
      description:descriptionInput.value.trim(),
      timeLimitSeconds:Number(durationInput.value||0)*60,
      questionVersionIds:selected.map(q=>q.versionId),
    };
    draft=await adminApi.saveSimulationSet(payload);
    selected=(draft.questions||[]).map(q=>({...q}));
    editorDirty=false;
    if(showSuccess)showSetMessage('Draft saved.','success');
    renderAll();
    return draft;
  }
  function renderValidationResult(validation){
    const errors=validation?.errors||[];const warnings=validation?.warnings||[];
    const parts=[];
    if(errors.length)parts.push(...errors.map(x=>`<div class="set-alert error">${escapeHtml(x)}</div>`));
    if(warnings.length)parts.push(...warnings.map(x=>`<div class="set-alert warning">${escapeHtml(x)}</div>`));
    if(!errors.length)parts.unshift('<div class="set-alert success">Server validation passed. This Draft is ready to publish.</div>');
    message.innerHTML=parts.join('');
  }
  async function validateSavedSet(){
    const validation=await adminApi.validateSimulationSet(draft.setVersionId);
    renderValidationResult(validation);
    document.querySelector('#set-publish').disabled=!validation.canPublish;
    return validation;
  }

  document.querySelector('#set-save').addEventListener('click',async e=>{
    const btn=e.currentTarget;btn.disabled=true;
    try{await saveSetDraft(true);}catch(err){showSetMessage(err.message||'Unable to save Draft.');}
    finally{btn.disabled=false;}
  });
  document.querySelector('#set-validate').addEventListener('click',async e=>{
    const btn=e.currentTarget;btn.disabled=true;document.querySelector('#set-publish').disabled=true;
    try{await saveSetDraft(false);await validateSavedSet();}catch(err){showSetMessage(err.message||'Unable to validate this Draft.');}
    finally{btn.disabled=false;}
  });
  document.querySelector('#set-publish').addEventListener('click',async e=>{
    const btn=e.currentTarget;btn.disabled=true;
    try{
      await saveSetDraft(false);
      const validation=await validateSavedSet();
      if(!validation.canPublish)return;
      if(!confirm('Publish this simulation set version? Published versions are immutable. Future changes require a new revision.'))return;
      const published=await adminApi.publishSimulationSet(draft.setVersionId);
      editorDirty=false;
      go(`/admin/sets/${published.setVersionId}/preview`);
    }catch(err){showSetMessage(err.message||'Unable to publish this simulation set.');}
    finally{if(location.hash.includes('/edit'))btn.disabled=false;}
  });

  renderAll();
}

async function questionEditorPage(questionId){

    };

    document.querySelectorAll('.qe-media-input').forEach(input=>input.addEventListener('change',async()=>{
      const file=input.files?.[0];if(!file)return;
      try{
        draft=readQuestionEditorForm();
        if(!draft.versionId){const saved=await saveCurrent(false);if(!saved)return;}
        const {blob,extension}=await compressQuestionImage(file);
        const slot=input.dataset.slot;
        const path=`questions/${draft.questionId}/versions/${draft.versionId}/${slot}-${crypto.randomUUID()}.${extension}`;
        await adminApi.uploadQuestionMedia(path,blob);
        setDraftMedia(slot,path);
        draft=await adminApi.saveQuestionDraft(readQuestionEditorForm());
        editorDirty=false;
        renderEditor();
      }catch(err){showEditorErrors([err.message||'Unable to upload image.']);}
    }));

    document.querySelectorAll('.qe-media-remove').forEach(btn=>btn.addEventListener('click',async()=>{
      try{
        draft=readQuestionEditorForm();setDraftMedia(btn.dataset.slot,null);
        draft=await adminApi.saveQuestionDraft(readQuestionEditorForm());editorDirty=false;renderEditor();
      }catch(err){showEditorErrors([err.message||'Unable to remove image.']);}
    }));

    hydratePrivateImages(root).catch(()=>{});

    async function saveCurrent(showToast=true){
      const payload=readQuestionEditorForm();
      const errors=validateQuestionDraft(payload,'draft');
      if(errors.length){showEditorErrors(errors);return null;}
      const saved=await adminApi.saveQuestionDraft(payload);
      draft=saved;editorDirty=false;
      if(location.hash==='#/admin/questions/new') history.replaceState(null,'',`#/admin/questions/${draft.questionId}/edit`);
      renderEditor();
      if(showToast) showEditorErrors(['Draft saved.']);
      return saved;
    }

    document.querySelector('#qe-save').addEventListener('click',async e=>{e.currentTarget.disabled=true;try{await saveCurrent(true);}catch(err){showEditorErrors([err.message||'Unable to save Draft.']);}finally{e.currentTarget.disabled=false;}});
    document.querySelector('#qe-preview').addEventListener('click',async e=>{e.currentTarget.disabled=true;try{const saved=await saveCurrent(false);if(saved)go(`/admin/questions/${saved.questionId}/preview`);}catch(err){showEditorErrors([err.message||'Unable to preview.']);}finally{e.currentTarget.disabled=false;}});
    document.querySelector('#qe-publish').addEventListener('click',async e=>{
      e.currentTarget.disabled=true;
      try{
        const payload=readQuestionEditorForm();
        const errors=validateQuestionDraft(payload,'publish');
        if(errors.length){showEditorErrors(errors);return;}
        const saved=await adminApi.saveQuestionDraft(payload);
        await adminApi.publishQuestion(saved.versionId);
        editorDirty=false;
        go('/admin/questions');
      }catch(err){showEditorErrors(String(err.message||'Unable to publish.').split('\n').filter(Boolean));}
      finally{e.currentTarget.disabled=false;}
    });
  }
  renderEditor();
}
async function questionPreviewPage(questionId){
  if(!await requireProfile('admin'))return;
  loading('Loading student preview…');
  const latest=await adminApi.questionEditor(questionId,null);
  const p=await adminApi.questionPreview(latest.versionId);
  const q={
    question_type:'mcq_single',
    language_mode:p.languageMode,
    prompt_ms:p.promptMs,
    prompt_en:p.promptEn,
    prompt_image_path:p.promptImagePath,
    options:(p.options||[]).map(o=>({id:o.id||o.key,key:o.key,text_ms:o.textMs,text_en:o.textEn,image_path:o.imagePath})),
    saved_answer:{}
  };
  shell(`<div class="page-head"><div><span class="eyebrow">Preview as Student</span><h1>${p.questionCode?`${escapeHtml(p.questionCode)} · `:''}${escapeHtml(p.subjectName||'Question Preview')} · v${Number(p.versionNo||1)}</h1><p class="muted">This uses the same question layout as the student simulator.</p></div><div class="preview-actions"><a class="btn ghost" href="/admin/questions/${p.questionId}/edit" data-link>Back to Editor</a><a class="btn ghost" href="/admin/questions" data-link>Question Bank</a></div></div><section class="preview-stage"><div class="phone-preview"><div class="preview-phone-top"><span>Question Preview</span><span>01:30:00</span></div><div class="question-panel preview-question"><div class="question-meta"><span class="subject-pill">${escapeHtml(p.subjectName||'')}</span><span>${escapeHtml(p.topicName||'')}</span></div>${studentQuestionMarkup(q,{preview:true})}</div></div></section>`,'admin');
  hydratePrivateImages(root).catch(()=>{});
}
async function studentsPage(){if(!await requireProfile('admin'))return;loading();const students=await adminApi.listStudents();shell(`<div class="page-head"><div><span class="eyebrow">Administration</span><h1>Students</h1></div>${button('Add Student','primary','id="add-student"')}</div><section class="card"><div class="table-wrap"><table><thead><tr><th>Student</th><th>Email</th><th>Status</th><th>Last Activity</th><th></th></tr></thead><tbody>${(students||[]).map(s=>`<tr><td>${escapeHtml(s.name)}</td><td>${escapeHtml(s.email)}</td><td>${s.active?'Active':'Inactive'}</td><td>${date(s.lastActivityAt||s.lastSignInAt)}</td><td><a href="/admin/students/${s.userId}" data-link>View</a> · <button class="link-btn reset" data-id="${s.userId}">Reset password</button> · <button class="link-btn active" data-id="${s.userId}" data-active="${s.active}">${s.active?'Deactivate':'Activate'}</button></td></tr>`).join('')}</tbody></table></div></section>`,'admin'); document.querySelector('#add-student').onclick=()=>studentModal(); document.querySelectorAll('.reset').forEach(b=>b.onclick=async()=>{const p=prompt('Enter a new temporary password (minimum 6 characters):');if(p){await adminApi.resetPassword(b.dataset.id,p);alert('Password reset.');}}); document.querySelectorAll('.active').forEach(b=>b.onclick=async()=>{await adminApi.setActive(b.dataset.id,b.dataset.active!=='true');location.reload();});}
function studentModal(){const wrap=document.createElement('div');wrap.className='modal-backdrop';wrap.innerHTML=`<div class="modal"><h2>Add Student</h2><form id="student-form"><label>Name<input name="name" required></label><label>Email<input name="email" type="email" required></label><label>Temporary Password<input name="temporaryPassword" type="password" minlength="6" required></label><label>School Year / Level<input name="schoolYear" value="Year 6"></label><div id="modal-error" class="form-error"></div><div class="modal-actions">${button('Cancel','ghost','type="button" id="cancel"')}${button('Create Student','primary','type="submit"')}</div></form></div>`;document.body.append(wrap);wrap.querySelector('#cancel').onclick=()=>wrap.remove();wrap.querySelector('#student-form').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);try{await adminApi.createStudent(Object.fromEntries(fd));wrap.remove();location.reload();}catch(err){wrap.querySelector('#modal-error').textContent=err.message;}};}
async function studentDetail(userId){if(!await requireProfile('admin'))return;loading();const d=await adminApi.studentHistory(userId);shell(`<div class="page-head"><div><span class="eyebrow">Student</span><h1>${escapeHtml(d.profile.displayName)}</h1><p>${escapeHtml(d.profile.email)} · ${d.profile.active?'Active':'Inactive'} · ${escapeHtml(d.profile.schoolYear||'')}</p></div></div><section class="stats"><div class="stat"><b>${d.summary.totalAttempts}</b><span>Attempts</span></div><div class="stat"><b>${pct(d.summary.bestPercentage)}</b><span>Best</span></div><div class="stat"><b>${pct(d.summary.averagePercentage)}</b><span>Average</span></div><div class="stat"><b>${pct(d.summary.latestPercentage)}</b><span>Latest</span></div></section><section class="card"><h2>Subject Performance</h2><div class="subject-grid">${(d.subjectPerformance||[]).map(s=>`<div class="stat"><b>${pct(s.percentage)}</b><span>${escapeHtml(s.name)}</span></div>`).join('')}</div></section><section class="card"><h2>Attempt History</h2>${adminHistoryTable(d.attempts||[])}</section>`,'admin');}
function adminHistoryTable(rows){if(!rows.length)return'<p class="muted">No completed attempts yet.</p>';return`<div class="table-wrap"><table><thead><tr><th>Set</th><th>Score</th><th>Grade</th><th>Time</th><th>Date</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td>${escapeHtml(r.setTitle)}</td><td>${pct(r.percentage)}</td><td>${escapeHtml(r.grade||'')}</td><td>${formatDuration(r.elapsedSeconds)}</td><td>${date(r.submittedAt)}</td><td><a href="/admin/review/${r.attemptId}" data-link>Review</a></td></tr>`).join('')}</tbody></table></div>`;}

async function render(){clearInterval(quizTimer);try{const p=(location.hash.slice(1) || '/');if(p==='/')return loginPage();if(p==='/student')return studentDashboard();if(p==='/student/history')return studentHistory();if(p==='/student/leaderboard')return studentLeaderboard();if(p==='/student/profile')return studentProfile();if(p.startsWith('/student/practice/attempt/'))return practiceAttemptPage(p.split('/').pop());if(p.startsWith('/student/practice/results/'))return practiceResultsPage(p.split('/').pop());if(p.startsWith('/student/practice/review/'))return practiceReviewPage(p.split('/').pop());if(p.startsWith('/student/quiz/'))return quizPage(p.split('/').pop());if(p.startsWith('/student/review/'))return reviewPage(p.split('/').pop());if(p.startsWith('/student/results/'))return resultsPage(p.split('/').pop());if(p==='/admin')return adminDashboard();if(p==='/admin/students')return studentsPage();if(p==='/admin/questions')return questionBankPage();if(p==='/admin/references')return referenceLibraryPage();if(/^\/admin\/references\/[^/]+$/.test(p))return referenceDocumentPage(p.split('/')[3]);if(p==='/admin/ai')return go('/admin/generator');if(p==='/admin/generator')return generationJobsPage();if(p==='/admin/generator/coverage')return generationCoveragePage();if(p==='/admin/generator/new')return generationJobNewPage();if(/^\/admin\/generator\/[^/]+\/review$/.test(p))return generationReviewPage(p.split('/')[3]);if(/^\/admin\/generator\/[^/]+$/.test(p))return generationJobPage(p.split('/')[3]);if(p==='/admin/questions/new')return questionEditorPage(null);if(/^\/admin\/questions\/[^/]+\/edit$/.test(p))return questionEditorPage(p.split('/')[3]);if(/^\/admin\/questions\/[^/]+\/preview$/.test(p))return questionPreviewPage(p.split('/')[3]);if(p==='/admin/sets')return simulationSetsPage();if(p==='/admin/sets/new')return simulationSetNewPage();if(/^\/admin\/sets\/[^/]+\/edit$/.test(p))return simulationSetBuilderPage(p.split('/')[3]);if(/^\/admin\/sets\/[^/]+\/preview$/.test(p))return simulationSetPreviewPage(p.split('/')[3]);if(p==='/admin/results')return adminPlaceholder('Results');if(p.startsWith('/admin/review/'))return reviewPage(p.split('/').pop(),true);if(p.startsWith('/admin/students/'))return studentDetail(p.split('/').pop());go('/');}catch(err){console.error(err);errorView(err);}}
window.addEventListener('beforeunload',e=>{if(editorDirty){e.preventDefault();e.returnValue='';}});window.addEventListener('hashchange', render);render();})();
</script>
