<script>function formatDuration(totalSeconds = 0) {
  const safe = Math.max(0, Number(totalSeconds) || 0);
  const minutes = Math.floor(safe / 60);
  const seconds = Math.floor(safe % 60);
  return `${minutes}m ${String(seconds).padStart(2, '0')}s`;
}

function navigatorState({ current, answered, flagged }) {
  if (current) return 'current';
  if (flagged) return 'flagged';
  if (answered) return 'answered';
  return 'unanswered';
}

function simulationAction(status) {
  return ({ not_started: 'Start Simulation', in_progress: 'Resume Simulation', completed: 'Try Again' })[status] || 'Start Simulation';
}

function languageBlocks(question) {
  const mode = question.language_mode;
  if (mode === 'bilingual') return [
    question.prompt_ms && { lang: 'ms', text: question.prompt_ms },
    question.prompt_en && { lang: 'en', text: question.prompt_en },
  ].filter(Boolean);
  if (mode === 'en') return question.prompt_en ? [{ lang: 'en', text: question.prompt_en }] : [];
  return question.prompt_ms ? [{ lang: 'ms', text: question.prompt_ms }] : [];
}

function optionLanguageBlocks(mode, option) {
  if (mode === 'bilingual') return [
    option.text_ms && { lang: 'ms', text: option.text_ms },
    option.text_en && { lang: 'en', text: option.text_en },
  ].filter(Boolean);
  if (mode === 'en') return option.text_en ? [{ lang: 'en', text: option.text_en }] : [];
  return option.text_ms ? [{ lang: 'ms', text: option.text_ms }] : [];
}

function filterReviewQuestions(rows = [], filter = 'all') {
  if (filter === 'wrong') return rows.filter((q) => !q.is_correct);
  if (filter === 'correct') return rows.filter((q) => q.is_correct);
  if (filter === 'flagged') return rows.filter((q) => q.flagged);
  return rows;
}

function isAnswered(question) {
  const a = question.saved_answer || {};
  if (question.question_type === 'mcq_single') return Boolean(a.selected_option_id);
  if (question.question_type === 'numeric') return a.answer_numeric !== null && a.answer_numeric !== undefined && a.answer_numeric !== '';
  if (question.question_type === 'short_text') return Boolean(String(a.answer_text ?? '').trim());
  return false;
}

function countUnanswered(questions = []) {
  return questions.filter((q) => !isAnswered(q)).length;
}

function remainingSeconds(expiresAt, now = Date.now()) {
  return Math.max(0, Math.floor((new Date(expiresAt).getTime() - now) / 1000));
}

function escapeHtml(value = '') {
  return String(value).replace(/[&<>'"]/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' })[c]);
}

const SUBJECT_LABELS = {
  INSANIAH: 'Kecerdasan Insaniah',
  MATH: 'Mathematics',
  SCI: 'Science',
  EN: 'English',
  BM: 'Bahasa Melayu',
  IQ: 'IQ / Logical Reasoning',
  GK: 'General Knowledge'
};

function subjectLanguageMode(subjectCode) {
  if (subjectCode === 'EN') return 'en';
  if (subjectCode === 'BM') return 'ms';
  return 'bilingual';
}

function blankQuestionDraft() {
  return {
    questionId: null,
    displayNo: null,
    questionCode: null,
    versionId: null,
    versionNo: 1,
    status: 'draft',
    subjectId: '',
    subjectCode: '',
    topicId: null,
    difficulty: 'medium',
    promptMs: '',
    promptEn: '',
    promptImagePath: null,
    options: ['A', 'B', 'C', 'D'].map(key => ({
      key, textMs: '', textEn: '', imagePath: null
    })),
    correctKey: null,
    explanationMs: '',
    explanationEn: '',
    explanationImagePath: null
  };
}

function isExactAbcd(options) {
  return Array.isArray(options)
    && options.length === 4
    && options.map(x => x.key).join(',') === 'A,B,C,D';
}

function hasOptionContent(o) {
  return Boolean(
    String(o?.textMs || '').trim()
    || String(o?.textEn || '').trim()
    || o?.imagePath
  );
}

function validateQuestionDraft(draft, mode = 'draft') {
  const errors = [];
  if (!draft?.subjectId) errors.push('Subject is required.');
  if (mode !== 'publish') return errors;

  const label = SUBJECT_LABELS[draft.subjectCode] || 'this subject';
  const lang = subjectLanguageMode(draft.subjectCode);

  if (!isExactAbcd(draft.options)) {
    errors.push('Exactly four options A, B, C and D are required.');
    return errors;
  }

  if ((lang === 'ms' || lang === 'bilingual') && !String(draft.promptMs || '').trim()) {
    errors.push(`Malay prompt is required for ${label}.`);
  }
  if ((lang === 'en' || lang === 'bilingual') && !String(draft.promptEn || '').trim()) {
    errors.push(`English prompt is required for ${label}.`);
  }

  draft.options.forEach(o => {
    if (!hasOptionContent(o)) errors.push(`Option ${o.key} is empty.`);
    if (String(o.textMs || '').trim() || String(o.textEn || '').trim()) {
      if ((lang === 'ms' || lang === 'bilingual') && !String(o.textMs || '').trim()) {
        errors.push(`Malay text is required for option ${o.key}.`);
      }
      if ((lang === 'en' || lang === 'bilingual') && !String(o.textEn || '').trim()) {
        errors.push(`English text is required for option ${o.key}.`);
      }
    }
  });

  if (!['A', 'B', 'C', 'D'].includes(draft.correctKey)) {
    errors.push('Select the correct answer.');
  }
  if ((lang === 'ms' || lang === 'bilingual') && !String(draft.explanationMs || '').trim()) {
    errors.push(`Malay explanation is required for ${label}.`);
  }
  if ((lang === 'en' || lang === 'bilingual') && !String(draft.explanationEn || '').trim()) {
    errors.push(`English explanation is required for ${label}.`);
  }

  return [...new Set(errors)];
}

window.PKSK_CORE = { formatDuration, navigatorState, simulationAction, languageBlocks, optionLanguageBlocks, filterReviewQuestions, isAnswered, countUnanswered, remainingSeconds, escapeHtml, subjectLanguageMode, blankQuestionDraft, validateQuestionDraft, isExactAbcd };
</script>
<script>(() => {

  const SESSION_KEY = 'pksk_session_v1';

  function makeError(payload, status) {
    const message = payload?.message || payload?.error_description || payload?.msg || payload?.error || payload?.hint || `Request failed (${status})`;
    const err = new Error(String(message));
    err.status = status;
    return err;
  }

  async function parseResponse(response) {
    const text = await response.text();
    let payload = null;
    if (text) {
      try { payload = JSON.parse(text); }
      catch { payload = text; }
    }
    if (!response.ok) throw makeError(payload, response.status);
    return payload;
  }

  async function rawJson(url, options = {}) {
    return parseResponse(await fetch(url, options));
  }

  function loadSession() {
    try { return JSON.parse(localStorage.getItem(SESSION_KEY) || 'null'); }
    catch { return null; }
  }

  function saveSession(data) {
    if (!data?.access_token) return null;
    const expiresAtMs = data.expires_at
      ? Number(data.expires_at) * 1000
      : Date.now() + Number(data.expires_in || 3600) * 1000;
    const session = { ...data, expires_at_ms: expiresAtMs };
    localStorage.setItem(SESSION_KEY, JSON.stringify(session));
    return session;
  }

  function clearSession() { localStorage.removeItem(SESSION_KEY); }

  async function refreshSession(session) {
    if (!session?.refresh_token) { clearSession(); return null; }
    try {
      const data = await rawJson(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
        method: 'POST',
        headers: {
          apikey: SUPABASE_PUBLISHABLE_KEY,
          'content-type': 'application/json',
        },
        body: JSON.stringify({ refresh_token: session.refresh_token }),
      });
      return saveSession(data);
    } catch (err) {
      clearSession();
      throw err;
    }
  }

  async function validSession() {
    const session = loadSession();
    if (!session?.access_token) return null;
    const expiry = Number(session.expires_at_ms || 0);
    if (expiry && expiry > Date.now() + 60_000) return session;
    return refreshSession(session);
  }

  async function authedJson(path, options = {}) {
    const session = await validSession();
    if (!session) throw new Error('Authentication required. Please log in again.');
    const bodyIsBlob = typeof Blob !== 'undefined' && options.body instanceof Blob;
    const headers = {
      apikey: SUPABASE_PUBLISHABLE_KEY,
      Authorization: `Bearer ${session.access_token}`,
      ...(options.body && !bodyIsBlob ? { 'content-type': 'application/json' } : {}),
      ...(options.headers || {}),
    };
    try {
      return await rawJson(`${SUPABASE_URL}${path}`, { ...options, headers });
    } catch (err) {
      if (err?.status === 401 && loadSession()?.refresh_token) {
        const refreshed = await refreshSession(loadSession());
        const retryHeaders = { ...headers, Authorization: `Bearer ${refreshed.access_token}` };
        return rawJson(`${SUPABASE_URL}${path}`, { ...options, headers: retryHeaders });
      }
      throw err;
    }
  }

      method: 'POST',

  }

  async function invoke(name, body = {}) {

  }

const IMAGE_TYPES = new Set(['image/jpeg','image/png','image/webp']);
const MAX_SOURCE_BYTES = 8 * 1024 * 1024;
const MAX_IMAGE_DIMENSION = 1600;
const WEBP_QUALITY = 0.82;
const mediaUrlCache = new Map();

async function compressQuestionImage(file){
  if(!file || !IMAGE_TYPES.has(file.type)) throw new Error('Please choose a JPG, PNG or WebP image.');
  if(file.size > MAX_SOURCE_BYTES) throw new Error('Image is too large. Maximum source size is 8 MB.');
  if(typeof createImageBitmap !== 'function') return {blob:file,extension:file.type==='image/png'?'png':file.type==='image/webp'?'webp':'jpg'};
  try{
    const bitmap=await createImageBitmap(file);
    const scale=Math.min(1,MAX_IMAGE_DIMENSION/Math.max(bitmap.width,bitmap.height));
    const width=Math.max(1,Math.round(bitmap.width*scale));
    const height=Math.max(1,Math.round(bitmap.height*scale));
    const canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;
    const ctx=canvas.getContext('2d');ctx.drawImage(bitmap,0,0,width,height);bitmap.close?.();
    const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/webp',WEBP_QUALITY));
    if(blob) return {blob,extension:'webp'};
  }catch(err){console.warn('Image compression fallback:',err);}
  return {blob:file,extension:file.type==='image/png'?'png':file.type==='image/webp'?'webp':'jpg'};
}

async function secureMediaUrl(path){
  if(!path)return '';

}

    try{img.src=await secureMediaUrl(path);img.classList.remove('media-loading');}
    catch(err){img.alt='Image unavailable';img.classList.add('media-error');}
  }));
}

    const actions=document.querySelector('.exam-actions').querySelectorAll('button'); actions[0].onclick=()=>{if(index>0){index--;draw();}}; actions[1].onclick=async()=>{q.saved_answer={...(q.saved_answer||{}),flagged:!q.saved_answer?.flagged}; await saveQ(q); draw();}; actions[2].onclick=()=>{if(index<payload.questions.length-1){index++;draw();}else submitFlow();}; document.querySelectorAll('.nav-q').forEach(b=>b.onclick=()=>{index=Number(b.dataset.i);draw();}); document.querySelectorAll('.option').forEach(b=>b.onclick=async()=>{q.saved_answer={...(q.saved_answer||{}),selected_option_id:b.dataset.option}; draw(); await saveQ(q);}); hydratePrivateImages(root).catch(()=>{}); updateTimer(); };

}
async function questionEditorPage(questionId){
  if(!await requireProfile('admin'))return;
  loading('Loading Question Editor…');
  const taxonomy=await adminApi.taxonomy();
  let draft=questionId?await adminApi.questionEditor(questionId,null):blankQuestionDraft();
  if(draft.status==='archived') throw new Error('Archived questions cannot be edited. Duplicate the question to create a new Draft.');
  if(draft.status==='published') draft=await adminApi.createQuestionRevision(draft.versionId);
  editorDirty=false;

  const subjectById=()=>new Map((taxonomy.subjects||[]).map(x=>[x.id,x]));
  const currentMode=()=>subjectLanguageMode(draft.subjectCode||'');
  const optionFor=(key)=>draft.options?.find(o=>o.key===key)||{key,textMs:'',textEn:'',imagePath:null};

  function readQuestionEditorForm(){
    const subjectId=document.querySelector('#qe-subject')?.value||draft.subjectId||'';
    const subject=subjectById().get(subjectId);
    const value=(id,fallback='')=>document.querySelector(id)?.value ?? fallback ?? '';
    return {
      ...draft,
      subjectId,
      subjectCode:subject?.code||draft.subjectCode||'',
      topicId:document.querySelector('#qe-topic')?.value||null,
      difficulty:document.querySelector('#qe-difficulty')?.value||'medium',
      promptMs:value('#qe-prompt-ms',draft.promptMs),
      promptEn:value('#qe-prompt-en',draft.promptEn),
      promptImagePath:draft.promptImagePath||null,
      options:['A','B','C','D'].map(key=>{
        const old=optionFor(key);
        return {key,textMs:value(`#qe-${key}-ms`,old.textMs),textEn:value(`#qe-${key}-en`,old.textEn),imagePath:old.imagePath||null};
      }),
      correctKey:document.querySelector('input[name="qe-correct"]:checked')?.value||null,
      explanationMs:value('#qe-exp-ms',draft.explanationMs),
      explanationEn:value('#qe-exp-en',draft.explanationEn),
      explanationImagePath:draft.explanationImagePath||null
    };
  }

  function showEditorErrors(errors=[]){
    const box=document.querySelector('#qe-errors');
    if(!box)return;
    box.innerHTML=errors.length?`<ul class="validation-list">${errors.map(e=>`<li>${escapeHtml(e)}</li>`).join('')}</ul>`:'';
  }

  function languageFields(mode){
    if(!draft.subjectId)return `<div class="empty editor-language-note">Choose a Subject to display the correct language fields.</div>`;
    const ms=mode==='ms'||mode==='bilingual';
    const en=mode==='en'||mode==='bilingual';
    const prompt=[];
    if(ms)prompt.push(`<label>Question / Soalan (Bahasa Melayu)<textarea id="qe-prompt-ms" rows="5">${escapeHtml(draft.promptMs||'')}</textarea></label>`);
    if(en)prompt.push(`<label>Question (English)<textarea id="qe-prompt-en" rows="5">${escapeHtml(draft.promptEn||'')}</textarea></label>`);
    return prompt.join('');
  }

  function mediaSlot(slot,path,label='Optional image'){
    return `<div class="media-slot" data-slot="${escapeHtml(slot)}"><span class="muted small">${escapeHtml(label)}</span>${path?`<img class="media-preview media-loading" data-media-path="${escapeHtml(path)}" alt="${escapeHtml(label)}">`:''}<div class="media-controls"><label class="btn ghost file-button">${path?'Replace Image':'Upload Image'}<input class="qe-media-input" data-slot="${escapeHtml(slot)}" type="file" accept="image/jpeg,image/png,image/webp"></label>${path?`<button type="button" class="btn ghost qe-media-remove" data-slot="${escapeHtml(slot)}">Remove Image</button>`:''}</div></div>`;
  }

  function optionFields(key,mode){
    const o=optionFor(key);const ms=mode==='ms'||mode==='bilingual';const en=mode==='en'||mode==='bilingual';
    return `<section class="option-editor"><div class="option-editor-head"><h3>Option ${key}</h3><label class="correct-choice"><input type="radio" name="qe-correct" value="${key}" ${draft.correctKey===key?'checked':''}> Correct answer</label></div>${ms?`<label>Malay text<textarea id="qe-${key}-ms" rows="2">${escapeHtml(o.textMs||'')}</textarea></label>`:''}${en?`<label>English text<textarea id="qe-${key}-en" rows="2">${escapeHtml(o.textEn||'')}</textarea></label>`:''}${mediaSlot(`option-${key.toLowerCase()}`,o.imagePath,`Optional image for option ${key}`)}</section>`;
  }

  function explanationFields(mode){
    const ms=mode==='ms'||mode==='bilingual';const en=mode==='en'||mode==='bilingual';
    return `${ms?`<label>Explanation / Penerangan (Bahasa Melayu)<textarea id="qe-exp-ms" rows="4">${escapeHtml(draft.explanationMs||'')}</textarea></label>`:''}${en?`<label>Explanation (English)<textarea id="qe-exp-en" rows="4">${escapeHtml(draft.explanationEn||'')}</textarea></label>`:''}`;
  }

  function renderEditor(){
    const mode=currentMode();
    const subjects=(taxonomy.subjects||[]).map(x=>`<option value="${escapeHtml(x.id)}" ${x.id===draft.subjectId?'selected':''}>${escapeHtml(x.name)}</option>`).join('');
    const topics=(taxonomy.topics||[]).filter(x=>x.subject_id===draft.subjectId).map(x=>`<option value="${escapeHtml(x.id)}" ${x.id===draft.topicId?'selected':''}>${escapeHtml(x.name)}</option>`).join('');
    shell(`<div class="page-head"><div><span class="eyebrow">Question Bank</span><h1>${draft.questionId?`Edit Question · v${Number(draft.versionNo||1)}`:'Add Question'}</h1><p class="muted">A–D single-answer multiple choice only.</p></div><a class="btn ghost" href="/admin/questions" data-link>Back to Question Bank</a></div>
    <div class="question-editor-grid"><section class="card editor-main"><div id="qe-errors" class="form-error"></div>
      <div class="editor-meta"><label>Subject<select id="qe-subject"><option value="">Choose subject</option>${subjects}</select></label><label>Topic <span class="muted small">(optional)</span><select id="qe-topic"><option value="">No topic</option>${topics}</select></label><label>Difficulty<select id="qe-difficulty"><option value="easy" ${draft.difficulty==='easy'?'selected':''}>Easy</option><option value="medium" ${(!draft.difficulty||draft.difficulty==='medium')?'selected':''}>Medium</option><option value="hard" ${draft.difficulty==='hard'?'selected':''}>Hard</option></select></label></div>
      <section class="editor-section"><h2>Question</h2>${languageFields(mode)}${mediaSlot('prompt',draft.promptImagePath,'Optional question image')}</section>
      <section class="editor-section"><h2>Answer Choices</h2>${['A','B','C','D'].map(k=>optionFields(k,mode)).join('')}</section>
      <section class="editor-section"><h2>Explanation</h2><p class="muted small">Can be blank while Draft. Required before Publish.</p>${explanationFields(mode)}</section>
    </section><aside class="card editor-side"><div class="status-pill ${escapeHtml(draft.status||'draft')}">${escapeHtml(String(draft.status||'draft').replace(/^./,c=>c.toUpperCase()))}</div><p class="muted small">Question ID</p><p class="visual-question-id mono">${escapeHtml(draft.questionCode||'Not saved yet')}</p><div class="editor-side-meta"><span class="muted small">Version</span><b>v${Number(draft.versionNo||1)}</b></div><div class="editor-actions">${button('Save Draft','ghost','id="qe-save"')}${button('Preview as Student','ghost','id="qe-preview"')}${button('Publish','primary','id="qe-publish"')}</div></aside></div>`,'admin');

    const markDirty=()=>{editorDirty=true;};
    document.querySelectorAll('#app input,#app textarea,#app select').forEach(el=>el.addEventListener('input',markDirty));
    document.querySelectorAll('#app select,#app input[type="radio"]').forEach(el=>el.addEventListener('change',markDirty));

    document.querySelector('#qe-subject').addEventListener('change',e=>{
      const current=readQuestionEditorForm();
      const subject=subjectById().get(e.target.value);
      draft={...current,subjectId:e.target.value,subjectCode:subject?.code||'',topicId:null};
      editorDirty=true;
      renderEditor();
    });

    const setDraftMedia=(slot,path)=>{
      if(slot==='prompt'){draft.promptImagePath=path;return;}
      const match=/^option-([a-d])$/.exec(slot);if(!match)return;
      const key=match[1].toUpperCase();
      draft.options=['A','B','C','D'].map(k=>{const o=optionFor(k);return k===key?{...o,imagePath:path}:{...o};});
    };

    document.querySelectorAll('.qe-media-input').forEach(input=>input.addEventListener('change',async()=>{
      const file=input.files?.[0];if(!file)return;
      try{
        draft=readQuestionEditorForm();
        if(!draft.versionId){const saved=await saveCurrent(false);if(!saved)return;}
        const {blob,extension}=await compressQuestionImage(file);
        const slot=input.dataset.slot;
        const path=`questions/${draft.questionId}/versions/${draft.versionId}/${slot}-${crypto.randomUUID()}.${extension}`;
        await adminApi.uploadQuestionMedia(path,blob);
        setDraftMedia(slot,path);
        draft=await adminApi.saveQuestionDraft(readQuestionEditorForm());
        editorDirty=false;
        renderEditor();
      }catch(err){showEditorErrors([err.message||'Unable to upload image.']);}
    }));

    document.querySelectorAll('.qe-media-remove').forEach(btn=>btn.addEventListener('click',async()=>{
      try{
        draft=readQuestionEditorForm();setDraftMedia(btn.dataset.slot,null);
        draft=await adminApi.saveQuestionDraft(readQuestionEditorForm());editorDirty=false;renderEditor();
      }catch(err){showEditorErrors([err.message||'Unable to remove image.']);}
    }));

    hydratePrivateImages(root).catch(()=>{});

    async function saveCurrent(showToast=true){
      const payload=readQuestionEditorForm();
      const errors=validateQuestionDraft(payload,'draft');
      if(errors.length){showEditorErrors(errors);return null;}
      const saved=await adminApi.saveQuestionDraft(payload);
      draft=saved;editorDirty=false;
      if(location.hash==='#/admin/questions/new') history.replaceState(null,'',`#/admin/questions/${draft.questionId}/edit`);
      renderEditor();
      if(showToast) showEditorErrors(['Draft saved.']);
      return saved;
    }

    document.querySelector('#qe-save').addEventListener('click',async e=>{e.currentTarget.disabled=true;try{await saveCurrent(true);}catch(err){showEditorErrors([err.message||'Unable to save Draft.']);}finally{e.currentTarget.disabled=false;}});
    document.querySelector('#qe-preview').addEventListener('click',async e=>{e.currentTarget.disabled=true;try{const saved=await saveCurrent(false);if(saved)go(`/admin/questions/${saved.questionId}/preview`);}catch(err){showEditorErrors([err.message||'Unable to preview.']);}finally{e.currentTarget.disabled=false;}});
    document.querySelector('#qe-publish').addEventListener('click',async e=>{
      e.currentTarget.disabled=true;
      try{
        const payload=readQuestionEditorForm();
        const errors=validateQuestionDraft(payload,'publish');
        if(errors.length){showEditorErrors(errors);return;}
        const saved=await adminApi.saveQuestionDraft(payload);
        await adminApi.publishQuestion(saved.versionId);
        editorDirty=false;
        go('/admin/questions');
      }catch(err){showEditorErrors(String(err.message||'Unable to publish.').split('\n').filter(Boolean));}
      finally{e.currentTarget.disabled=false;}
    });
  }
  renderEditor();
}

function studentModal(){const wrap=document.createElement('div');wrap.className='modal-backdrop';wrap.innerHTML=`<div class="modal"><h2>Add Student</h2><form id="student-form"><label>Name<input name="name" required></label><label>Email<input name="email" type="email" required></label><label>Temporary Password<input name="temporaryPassword" type="password" minlength="6" required></label><label>School Year / Level<input name="schoolYear" value="Year 6"></label><div id="modal-error" class="form-error"></div><div class="modal-actions">${button('Cancel','ghost','type="button" id="cancel"')}${button('Create Student','primary','type="submit"')}</div></form></div>`;document.body.append(wrap);wrap.querySelector('#cancel').onclick=()=>wrap.remove();wrap.querySelector('#student-form').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);try{await adminApi.createStudent(Object.fromEntries(fd));wrap.remove();location.reload();}catch(err){wrap.querySelector('#modal-error').textContent=err.message;}};}
async function studentDetail(userId){if(!await requireProfile('admin'))return;loading();const d=await adminApi.studentHistory(userId);shell(`<div class="page-head"><div><span class="eyebrow">Student</span><h1>${escapeHtml(d.profile.displayName)}</h1><p>${escapeHtml(d.profile.email)} · ${d.profile.active?'Active':'Inactive'} · ${escapeHtml(d.profile.schoolYear||'')}</p></div></div><section class="stats"><div class="stat"><b>${d.summary.totalAttempts}</b><span>Attempts</span></div><div class="stat"><b>${pct(d.summary.bestPercentage)}</b><span>Best</span></div><div class="stat"><b>${pct(d.summary.averagePercentage)}</b><span>Average</span></div><div class="stat"><b>${pct(d.summary.latestPercentage)}</b><span>Latest</span></div></section><section class="card"><h2>Subject Performance</h2><div class="subject-grid">${(d.subjectPerformance||[]).map(s=>`<div class="stat"><b>${pct(s.percentage)}</b><span>${escapeHtml(s.name)}</span></div>`).join('')}</div></section><section class="card"><h2>Attempt History</h2>${adminHistoryTable(d.attempts||[])}</section>`,'admin');}
function adminHistoryTable(rows){if(!rows.length)return'<p class="muted">No completed attempts yet.</p>';return`<div class="table-wrap"><table><thead><tr><th>Set</th><th>Score</th><th>Grade</th><th>Time</th><th>Date</th><th></th></tr></thead><tbody>${rows.map(r=>`<tr><td>${escapeHtml(r.setTitle)}</td><td>${pct(r.percentage)}</td><td>${escapeHtml(r.grade||'')}</td><td>${formatDuration(r.elapsedSeconds)}</td><td>${date(r.submittedAt)}</td><td><a href="/admin/review/${r.attemptId}" data-link>Review</a></td></tr>`).join('')}</tbody></table></div>`;}

async function render(){clearInterval(quizTimer);try{const p=(location.hash.slice(1) || '/');if(p==='/')return loginPage();if(p==='/student')return studentDashboard();if(p==='/student/history')return studentHistory();if(p==='/student/profile')return studentProfile();if(p.startsWith('/student/quiz/'))return quizPage(p.split('/').pop());if(p.startsWith('/student/review/'))return reviewPage(p.split('/').pop());if(p.startsWith('/student/results/'))return resultsPage(p.split('/').pop());if(p==='/admin')return adminDashboard();if(p==='/admin/students')return studentsPage();if(p==='/admin/questions')return questionBankPage();if(p==='/admin/questions/new')return questionEditorPage(null);if(/^\/admin\/questions\/[^/]+\/edit$/.test(p))return questionEditorPage(p.split('/')[3]);if(/^\/admin\/questions\/[^/]+\/preview$/.test(p))return questionPreviewPage(p.split('/')[3]);if(p==='/admin/sets')return adminPlaceholder('Simulation Sets');if(p==='/admin/results')return adminPlaceholder('Results');if(p.startsWith('/admin/review/'))return reviewPage(p.split('/').pop(),true);if(p.startsWith('/admin/students/'))return studentDetail(p.split('/').pop());go('/');}catch(err){console.error(err);errorView(err);}}
window.addEventListener('beforeunload',e=>{if(editorDirty){e.preventDefault();e.returnValue='';}});window.addEventListener('hashchange', render);render();})();
</script>
</body>
</html>
