<div id="app"></div>
<script>function formatDuration(totalSeconds = 0) {
  const safe = Math.max(0, Number(totalSeconds) || 0);
  const minutes = Math.floor(safe / 60);
  const seconds = Math.floor(safe % 60);
  return `${minutes}m ${String(seconds).padStart(2, '0')}s`;
}

function navigatorState({ current, answered, flagged }) {
  if (current) return 'current';
  if (flagged) return 'flagged';
  if (answered) return 'answered';
  return 'unanswered';
}

function simulationAction(status) {
  return ({ not_started: 'Start Simulation', in_progress: 'Resume Simulation', completed: 'Try Again' })[status] || 'Start Simulation';
}

function practiceModeConfig(mode) {
  if (mode === 'quick') return { label: 'Quick Quiz', questionLimit: 10, timeLimitSeconds: 600, allowBacktrack: true, lockOnAnswer: false };
  if (mode === 'speed') return { label: 'Speed Quiz', questionLimit: 20, timeLimitSeconds: 300, allowBacktrack: false, lockOnAnswer: true };
  throw new Error('Unsupported practice mode');
}

function languageBlocks(question) {
  const mode = question.language_mode;
  if (mode === 'bilingual') return [
    question.prompt_ms && { lang: 'ms', text: question.prompt_ms },
    question.prompt_en && { lang: 'en', text: question.prompt_en },
  ].filter(Boolean);
  if (mode === 'en') return question.prompt_en ? [{ lang: 'en', text: question.prompt_en }] : [];
  return question.prompt_ms ? [{ lang: 'ms', text: question.prompt_ms }] : [];
}

function optionLanguageBlocks(mode, option) {
  if (mode === 'bilingual') return [
    option.text_ms && { lang: 'ms', text: option.text_ms },
    option.text_en && { lang: 'en', text: option.text_en },
  ].filter(Boolean);
  if (mode === 'en') return option.text_en ? [{ lang: 'en', text: option.text_en }] : [];
  return option.text_ms ? [{ lang: 'ms', text: option.text_ms }] : [];
}

function filterReviewQuestions(rows = [], filter = 'all') {
  if (filter === 'wrong') return rows.filter((q) => !q.is_correct);
  if (filter === 'correct') return rows.filter((q) => q.is_correct);
  if (filter === 'flagged') return rows.filter((q) => q.flagged);
  return rows;
}

function isAnswered(question) {
  const a = question.saved_answer || {};
  if (question.question_type === 'mcq_single') return Boolean(a.selected_option_id);
  if (question.question_type === 'numeric') return a.answer_numeric !== null && a.answer_numeric !== undefined && a.answer_numeric !== '';
  if (question.question_type === 'short_text') return Boolean(String(a.answer_text ?? '').trim());
  return false;
}

function countUnanswered(questions = []) {
  return questions.filter((q) => !isAnswered(q)).length;
}

function remainingSeconds(expiresAt, now = Date.now()) {
  return Math.max(0, Math.floor((new Date(expiresAt).getTime() - now) / 1000));
}

function escapeHtml(value = '') {
  return String(value).replace(/[&<>'"]/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' })[c]);
}

const SUBJECT_LABELS = {
  INSANIAH: 'Kecerdasan Insaniah',
  MATH: 'Mathematics',
  SCI: 'Science',
  EN: 'English',
  BM: 'Bahasa Melayu',
  IQ: 'IQ / Logical Reasoning',
  GK: 'General Knowledge'
};

function subjectLanguageMode(subjectCode) {
  if (subjectCode === 'EN') return 'en';
  if (subjectCode === 'BM') return 'ms';
  return 'bilingual';
}

const STANDARD_SET_QUOTAS = Object.freeze({
  INSANIAH: 20,
  MATH: 15,
  SCI: 15,
  EN: 15,
  BM: 15,
  IQ: 10,
  GK: 10,
});

const STANDARD_DIFFICULTY_TARGET = Object.freeze({ easy: 20, medium: 55, hard: 25 });

function summarizeSetComposition(rows = []) {
  const subjects = Object.fromEntries(Object.keys(STANDARD_SET_QUOTAS).map(code => [code, 0]));
  const difficulty = { easy: 0, medium: 0, hard: 0 };
  for (const row of rows) {
    if (Object.prototype.hasOwnProperty.call(subjects, row?.subjectCode)) subjects[row.subjectCode] += 1;
    if (Object.prototype.hasOwnProperty.call(difficulty, row?.difficulty)) difficulty[row.difficulty] += 1;
  }
  return { total: rows.length, subjects, difficulty };
}

function validateSetComposition(rows = [], timeLimitSeconds = 5400) {
  const summary = summarizeSetComposition(rows);
  const errors = [];
  const warnings = [];

  if (summary.total !== 100) {
    errors.push(`Exactly 100 questions are required; ${summary.total} selected.`);
  }

  for (const [code, required] of Object.entries(STANDARD_SET_QUOTAS)) {
    const actual = summary.subjects[code] || 0;
    if (actual !== required) {
      errors.push(`${SUBJECT_LABELS[code] || code}: ${actual} selected; ${required} required.`);
    }
  }

  const ids = rows.map(row => row?.versionId).filter(Boolean);
  if (new Set(ids).size !== ids.length) errors.push('Duplicate question versions are not allowed.');

  if (Number(timeLimitSeconds) !== 5400) {
    errors.push('Standard 100-question simulations must use a 90 minute time limit.');
  }

  const difficultyMismatch = Object.entries(STANDARD_DIFFICULTY_TARGET)
    .some(([level, target]) => summary.difficulty[level] !== target);
  if (summary.total === 100 && difficultyMismatch) {
    warnings.push(`Difficulty mix is ${summary.difficulty.easy}/${summary.difficulty.medium}/${summary.difficulty.hard}; target is 20/55/25 (Easy/Medium/Hard).`);
  }

  return { summary, errors, warnings, canPublish: errors.length === 0 };
}

function blankQuestionDraft() {
  return {
    questionId: null,
    displayNo: null,
    questionCode: null,
    versionId: null,
    versionNo: 1,
    status: 'draft',
    subjectId: '',
    subjectCode: '',
    topicId: null,
    difficulty: 'medium',
    promptMs: '',
    promptEn: '',
    promptImagePath: null,
    options: ['A', 'B', 'C', 'D'].map(key => ({
      key, textMs: '', textEn: '', imagePath: null
    })),
    correctKey: null,
    explanationMs: '',
    explanationEn: '',
    explanationImagePath: null
  };
}

function isExactAbcd(options) {
  return Array.isArray(options)
    && options.length === 4
    && options.map(x => x.key).join(',') === 'A,B,C,D';
}

function hasOptionContent(o) {
  return Boolean(
    String(o?.textMs || '').trim()
    || String(o?.textEn || '').trim()
    || o?.imagePath
  );
}

function validateQuestionDraft(draft, mode = 'draft') {
  const errors = [];
  if (!draft?.subjectId) errors.push('Subject is required.');
  if (mode !== 'publish') return errors;

  const label = SUBJECT_LABELS[draft.subjectCode] || 'this subject';
  const lang = subjectLanguageMode(draft.subjectCode);

  if (!isExactAbcd(draft.options)) {
    errors.push('Exactly four options A, B, C and D are required.');
    return errors;
  }

  if ((lang === 'ms' || lang === 'bilingual') && !String(draft.promptMs || '').trim()) {
    errors.push(`Malay prompt is required for ${label}.`);
  }
  if ((lang === 'en' || lang === 'bilingual') && !String(draft.promptEn || '').trim()) {
    errors.push(`English prompt is required for ${label}.`);
  }

  draft.options.forEach(o => {
    if (!hasOptionContent(o)) errors.push(`Option ${o.key} is empty.`);
    if (String(o.textMs || '').trim() || String(o.textEn || '').trim()) {
      if ((lang === 'ms' || lang === 'bilingual') && !String(o.textMs || '').trim()) {
        errors.push(`Malay text is required for option ${o.key}.`);
      }

function validateGenerationJobDraft(draft) {
  const errors=[];
  if(!String(draft?.name||'').trim()) errors.push('Job name is required.');
  const total=Number(draft?.totalQuestions);
  if(!Number.isInteger(total)||total<1||total>200) errors.push('Total questions must be an integer between 1 and 200.');

  const subjects=Array.isArray(draft?.subjects)?draft.subjects:[];
  if(!subjects.length) errors.push('At least one subject quota is required.');
  let subjectTotal=0;
  const selectedSubjects=new Map();
  for(const row of subjects){
    const count=Number(row?.questionCount);
    if(!STANDARD_SET_QUOTAS.hasOwnProperty(row?.subjectCode)) errors.push(`Invalid subject: ${row?.subjectCode||'unknown'}.`);
    if(!Number.isInteger(count)||count<0) errors.push(`${SUBJECT_LABELS[row?.subjectCode]||row?.subjectCode||'Subject'} quota must be a non-negative integer.`);
    else if(count>0){
      if(selectedSubjects.has(row.subjectCode)) errors.push(`Duplicate subject quota: ${row.subjectCode}.`);
      selectedSubjects.set(row.subjectCode,count);
      subjectTotal+=count;
      if(!STANDARD_SOURCE_POLICIES.includes(row?.sourcePolicy)) errors.push(`Invalid source policy for ${SUBJECT_LABELS[row.subjectCode]||row.subjectCode}.`);
    }
  }
  if(Number.isInteger(total)&&subjectTotal!==total) errors.push(`Subject quotas must sum to total questions (${total}).`);

  const diff=draft?.difficulty||{};
  const diffKeys=Object.keys(diff).sort().join(',');
  if(diffKeys!=='easy,hard,medium') errors.push('Difficulty must contain exactly Easy, Medium and Hard.');
  let difficultyTotal=0;
  for(const level of ['easy','medium','hard']){
    const count=Number(diff[level]);
    if(!Number.isInteger(count)||count<0) errors.push(`${level.replace(/^./,c=>c.toUpperCase())} difficulty quota must be a non-negative integer.`);
    else difficultyTotal+=count;
  }
  if(Number.isInteger(total)&&difficultyTotal!==total) errors.push(`Difficulty quotas must sum to total questions (${total}).`);

  if(!['ai_balanced','manual'].includes(draft?.topicMode)) errors.push('Choose a valid topic mode.');
  if(!['close_variant','fresh_variant','mixed'].includes(draft?.variationMode)) errors.push('Choose a valid variation mode.');
  if(!['conservative','balanced','creative'].includes(draft?.creativityLevel)) errors.push('Choose a valid creativity level.');
  if(!['strict','balanced','lenient'].includes(draft?.similarityPolicy)) errors.push('Choose a valid similarity policy.');

  if(draft?.topicMode==='manual'){
    const quotas=Array.isArray(draft?.manualTopicQuotas)?draft.manualTopicQuotas:[];
    for(const [subjectCode,subjectCount] of selectedSubjects){
      const mine=quotas.filter(q=>q?.subjectCode===subjectCode);
      const sum=mine.reduce((n,q)=>n+(Number.isInteger(Number(q?.questionCount))?Number(q.questionCount):0),0);
      if(!mine.length||sum!==subjectCount) errors.push(`Manual topic quotas for ${SUBJECT_LABELS[subjectCode]||subjectCode} must sum to ${subjectCount}.`);
      for(const q of mine){
        if(!String(q?.topicId||'').trim()) errors.push(`Manual topic quota for ${SUBJECT_LABELS[subjectCode]||subjectCode} needs a topic.`);
        if(!Number.isInteger(Number(q?.questionCount))||Number(q.questionCount)<=0) errors.push('Manual topic quotas must use positive integer counts.');
      }
    }
    if(quotas.some(q=>!selectedSubjects.has(q?.subjectCode))) errors.push('Manual topic quotas may only use selected subjects.');
  }

  const needsPdf=subjects.some(row=>Number(row?.questionCount)>0&&['pdf_only','pdf_led'].includes(row?.sourcePolicy));
  if(needsPdf&&(!Array.isArray(draft?.sourceDocumentIds)||draft.sourceDocumentIds.length===0)) errors.push('Select at least one Reference PDF for PDF-only or PDF-led subjects.');
  return [...new Set(errors)];
}

function summarizeGenerationPlan(items=[]) {
  const subjects=Object.fromEntries(Object.keys(STANDARD_SET_QUOTAS).map(code=>[code,0]));
  const difficulty={easy:0,medium:0,hard:0};
  let total=0,pdfInspiredCount=0,freshAiCount=0,externalKnowledgeCount=0;
  for(const item of items){
    const count=Number(item?.questionCount)||0;
    total+=count;
    if(item?.subjectCode){ if(!(item.subjectCode in subjects))subjects[item.subjectCode]=0; subjects[item.subjectCode]+=count; }
    if(item?.difficulty in difficulty)difficulty[item.difficulty]+=count;
    if(item?.sourceDocumentId)pdfInspiredCount+=count;
    else if(item?.sourcePolicy==='external_allowed')externalKnowledgeCount+=count;
    else freshAiCount+=count;
  }
  return {total,subjects,difficulty,pdfInspiredCount,freshAiCount,externalKnowledgeCount};
}

function validateGenerationPlanClient(job,items=[]) {
  const errors=[];
  const summary=summarizeGenerationPlan(items);
  const total=Number(job?.totalQuestions)||0;
  if(summary.total!==total) errors.push(`Plan total must be ${total}; currently ${summary.total}.`);
  const configured=new Map((job?.subjects||[]).filter(x=>Number(x?.questionCount)>0).map(x=>[x.subjectCode,Number(x.questionCount)]));
  for(const [code,required] of configured){
    const actual=summary.subjects[code]||0;
    if(actual!==required)errors.push(`${SUBJECT_LABELS[code]||code} plan total must be ${required}; currently ${actual}.`);
  }
  for(const [code,actual] of Object.entries(summary.subjects)){
    if(actual>0&&!configured.has(code))errors.push(`${SUBJECT_LABELS[code]||code} is not configured for this job.`);
  }
  for(const level of ['easy','medium','hard']){
    const required=Number(job?.difficulty?.[level]||0);
    if(summary.difficulty[level]!==required)errors.push(`${level.replace(/^./,c=>c.toUpperCase())} difficulty total must be ${required}; currently ${summary.difficulty[level]}.`);
  }
  for(const [i,item] of items.entries()){
    if(!Number.isInteger(Number(item?.questionCount))||Number(item.questionCount)<=0)errors.push(`Plan row ${i+1} must have a positive integer count.`);
    if(!STANDARD_SOURCE_POLICIES.includes(item?.sourcePolicy))errors.push(`Plan row ${i+1} has an invalid source policy.`);
    if(['pdf_only','pdf_led'].includes(item?.sourcePolicy)&&!item?.sourceDocumentId)errors.push(`Plan row ${i+1} requires a Reference PDF.`);
  }
  if(job?.topicMode==='manual'){
    for(const quota of job?.manualTopicQuotas||[]){
      const actual=items.filter(x=>x?.subjectCode===quota?.subjectCode&&x?.topicId===quota?.topicId).reduce((n,x)=>n+(Number(x?.questionCount)||0),0);
      if(actual!==Number(quota?.questionCount||0))errors.push(`Manual topic quota mismatch for ${quota?.subjectCode||'subject'}.`);
    }
  }
  return [...new Set(errors)];
}


const GENERATION_REVIEW_STATUSES = Object.freeze(['pass','needs_review','rejected','failed','accepted']);

function filterGeneratedCandidates(candidates=[],filters={}) {
  const term=String(filters.search||'').trim().toLowerCase();
  return (candidates||[]).filter(candidate=>{
    if(!GENERATION_REVIEW_STATUSES.includes(String(candidate?.status||'')))return false;
    if(filters.qaStatus&&candidate.status!==filters.qaStatus)return false;
    if(filters.subjectCode&&candidate.subjectCode!==filters.subjectCode)return false;
    if(filters.topicId&&candidate.topicId!==filters.topicId)return false;
    if(filters.difficulty&&candidate.difficulty!==filters.difficulty)return false;
    if(filters.sourceDocumentId&&(candidate.sourceRef?.documentId||'')!==filters.sourceDocumentId)return false;
    if(filters.variationMode&&candidate.variationMode!==filters.variationMode)return false;
    if(term){
      const optionText=Array.isArray(candidate.generated?.options)?candidate.generated.options.flatMap(o=>[o?.textMs,o?.textEn]).filter(Boolean).join(' '):'';
      const hay=[candidate.questionCode,candidate.subjectName,candidate.topicName,candidate.generated?.promptMs,candidate.generated?.promptEn,optionText,candidate.qa?.notes,candidate.sourceRef?.documentTitle,candidate.sourceRef?.sourceLabel].filter(Boolean).join(' ').toLowerCase();
      if(!hay.includes(term))return false;
    }
    return true;
  });
}

function allocateGapDifficulty(total,publishedDifficulty={}) {
  let remaining=Math.max(0,Number(total)||0);
  const targets={...STANDARD_DIFFICULTY_TARGET};
  const result={easy:0,medium:0,hard:0};
  const deficits=Object.fromEntries(Object.keys(targets).map(level=>[level,Math.max(0,targets[level]-(Number(publishedDifficulty?.[level])||0))]));
  while(remaining>0){
    const level=Object.keys(result).sort((a,b)=>deficits[b]-deficits[a]||targets[b]-targets[a])[0];
    result[level]+=1;
    deficits[level]=Math.max(0,deficits[level]-1);
    remaining-=1;
  }
  return result;
}

function buildGapGenerationDraft(coverage={},referenceDocumentIds=[]) {
  const subjects=(coverage.subjects||[]).filter(row=>Number(row?.poolShortage)>0).map(row=>({
    subjectCode:row.subjectCode,
    questionCount:Number(row.poolShortage),
    sourcePolicy:['IQ','GK'].includes(row.subjectCode)?'external_allowed':'hybrid',
  }));
  const totalQuestions=subjects.reduce((n,row)=>n+row.questionCount,0);
  return {
    name:`PKSK Coverage Gap · ${totalQuestions} Questions`,
    totalQuestions,
    subjects,
    difficulty:allocateGapDifficulty(totalQuestions,coverage.publishedDifficulty||{}),
    topicMode:'ai_balanced',manualTopicQuotas:[],variationMode:'mixed',creativityLevel:'balanced',
    avoidUsedConcepts:true,similarityPolicy:'balanced',sourceDocumentIds:[...(referenceDocumentIds||[])],
  };
}

function applySetSuggestions(selected=[],suggestions=[],quotas={}) {
  const out=(selected||[]).map((row,i)=>({...row,position:i+1}));
  const ids=new Set(out.map(row=>row.versionId));
  const counts={};
  for(const row of out) counts[row.subjectCode]=(counts[row.subjectCode]||0)+1;
  for(const suggestion of suggestions||[]){
    if(!suggestion?.versionId||ids.has(suggestion.versionId))continue;
    const limit=Number(quotas?.[suggestion.subjectCode]??Infinity);
    if((counts[suggestion.subjectCode]||0)>=limit)continue;
    out.push({...suggestion,position:out.length+1});
    ids.add(suggestion.versionId);
    counts[suggestion.subjectCode]=(counts[suggestion.subjectCode]||0)+1;
  }
  return out;
}

    generationProgress: (jobId) => rpc('admin_ai_generation_progress', { p_job_id: jobId }),
    questionPoolCoverage: (setVersionId = null) => rpc('admin_question_pool_coverage', { p_set_version_id: setVersionId || null }),
    setSuggestions: (setVersionId) => rpc('admin_simulation_set_suggestions', { p_set_version_id: setVersionId }),
    generateQuestionBatch: (jobId) => invoke('admin-generate-question-batch', { jobId }),
    acceptGeneratedCandidate: (itemId) => rpc('admin_accept_generated_candidate', { p_item_id: itemId }),
    rejectGeneratedCandidate: (itemId) => rpc('admin_reject_generated_candidate', { p_item_id: itemId }),
    regenerateGeneratedCandidate: (itemId) => rpc('admin_regenerate_generated_candidate', { p_item_id: itemId }),
    simulationSets: () => rpc('admin_simulation_set_list'),
    setCandidates: (filters = {}) => rpc('admin_simulation_set_candidates', {
      p_subject_id: filters.subjectId || null,
      p_difficulty: filters.difficulty || null,
      p_search: filters.search || null,
    }),
    createSimulationSet: ({ title, description = '', timeLimitSeconds = 5400 }) => rpc('admin_create_simulation_set', {
      p_title: title,
      p_description: description || null,
      p_time_limit_seconds: Number(timeLimitSeconds) || 5400,
    }),
    getSimulationSet: (setVersionId) => rpc('admin_get_simulation_set_builder', { p_set_version_id: setVersionId }),
    saveSimulationSet: (payload) => rpc('admin_save_simulation_set_draft', { p_payload: payload }),
    reviseSimulationSet: (setVersionId) => rpc('admin_create_simulation_set_revision', { p_set_version_id: setVersionId }),
    validateSimulationSet: (setVersionId) => rpc('admin_validate_simulation_set', { p_set_version_id: setVersionId }),
    publishSimulationSet: (setVersionId) => rpc('admin_publish_simulation_set', { p_set_version_id: setVersionId }),
    uploadQuestionMedia: (path, blob) => authedJson(`/storage/v1/object/question-media/${encodeStoragePath(path)}`, {
      method: 'POST',
      body: blob,
      headers: { 'Content-Type': blob.type || 'application/octet-stream', 'x-upsert': 'false' },
    }),
    mediaUrl: async (path) => {
      if (!path) return '';
      const data = await authedJson(`/storage/v1/object/sign/question-media/${encodeStoragePath(path)}`, {
        method: 'POST',
        body: JSON.stringify({ expiresIn: 3600 }),
      });
      const signed = data?.signedURL || data?.signedUrl || data?.signed_url;
      if (!signed) throw new Error('Unable to create a secure image link.');
      if (/^https?:/i.test(signed)) return signed;
      return `${SUPABASE_URL}/storage/v1${signed.startsWith('/') ? signed : `/${signed}`}`;
    },
    taxonomy: async () => {
      const subjects = await authedJson('/rest/v1/subjects?select=id,code,name,display_order&is_active=eq.true&order=display_order', { method: 'GET' });
      const topics = await authedJson('/rest/v1/topics?select=id,subject_id,code,name&is_active=eq.true&order=name', { method: 'GET' });
      return { subjects, topics };
    },
  };

  window.PKSK_API = { auth, studentApi, adminApi };
})();

const IMAGE_TYPES = new Set(['image/jpeg','image/png','image/webp']);
const MAX_SOURCE_BYTES = 8 * 1024 * 1024;
const MAX_IMAGE_DIMENSION = 1600;
const WEBP_QUALITY = 0.82;
const mediaUrlCache = new Map();

async function compressQuestionImage(file){
  if(!file || !IMAGE_TYPES.has(file.type)) throw new Error('Please choose a JPG, PNG or WebP image.');
  if(file.size > MAX_SOURCE_BYTES) throw new Error('Image is too large. Maximum source size is 8 MB.');
  if(typeof createImageBitmap !== 'function') return {blob:file,extension:file.type==='image/png'?'png':file.type==='image/webp'?'webp':'jpg'};
  try{
    const bitmap=await createImageBitmap(file);
    const scale=Math.min(1,MAX_IMAGE_DIMENSION/Math.max(bitmap.width,bitmap.height));
    const width=Math.max(1,Math.round(bitmap.width*scale));
    const height=Math.max(1,Math.round(bitmap.height*scale));
    const canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;
    const ctx=canvas.getContext('2d');ctx.drawImage(bitmap,0,0,width,height);bitmap.close?.();
    const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/webp',WEBP_QUALITY));
    if(blob) return {blob,extension:'webp'};
  }catch(err){console.warn('Image compression fallback:',err);}
  return {blob:file,extension:file.type==='image/png'?'png':file.type==='image/webp'?'webp':'jpg'};
}

async function secureMediaUrl(path){
  if(!path)return '';
  if(mediaUrlCache.has(path))return mediaUrlCache.get(path);

}

  if(legacyQuestion) throw new Error('This simulation contains a legacy question format. Please return to the dashboard and start the current version.');
  let index=0, saving=false, autoSubmitted=false;
  const draw=()=>{ const q=payload.questions[index]; const unanswered=countUnanswered(payload.questions); root.innerHTML=`<header class="exam-top"><div><b>${escapeHtml(payload.title)}</b><span>Question ${index+1}/${payload.question_count}</span></div><div id="timer" class="timer"></div></header><main class="exam-page"><section class="question-panel"><div class="question-meta"><span class="subject-pill">${escapeHtml(q.subject_name)}</span><span>${escapeHtml(q.topic_name||'')}</span></div>${renderQuestion(q)}<div id="save-status" class="save-status" aria-live="polite"></div><div class="exam-actions">${button('Previous','ghost',index===0?'disabled':'')}<button id="flag" class="btn ${q.saved_answer?.flagged?'flag-on':'ghost'}">${q.saved_answer?.flagged?'★ Flagged':'☆ Flag for Review'}</button>${button(index===payload.questions.length-1?'Review / Submit':'Next','primary')}</div></section><aside class="navigator"><h3>Jump to Question</h3><div class="nav-grid">${payload.questions.map((x,i)=>`<button class="nav-q ${navigatorState({current:i===index,answered:isAnswered(x),flagged:x.saved_answer?.flagged})}" data-i="${i}" aria-label="Question ${i+1}${isAnswered(x)?', answered':', unanswered'}${x.saved_answer?.flagged?', flagged':''}">${i+1}</button>`).join('')}</div><div class="legend"><span>● Current</span><span>● Answered</span><span>● Flagged</span><span>● Unanswered</span></div><p class="muted">${unanswered} unanswered</p></aside></main>`;
    const actions=document.querySelector('.exam-actions').querySelectorAll('button'); actions[0].onclick=()=>{if(index>0){index--;draw();}}; actions[1].onclick=async()=>{q.saved_answer={...(q.saved_answer||{}),flagged:!q.saved_answer?.flagged}; await saveQ(q); draw();}; actions[2].onclick=()=>{if(index<payload.questions.length-1){index++;draw();}else submitFlow();}; document.querySelectorAll('.nav-q').forEach(b=>b.onclick=()=>{index=Number(b.dataset.i);draw();}); document.querySelectorAll('.option').forEach(b=>b.onclick=async()=>{q.saved_answer={...(q.saved_answer||{}),selected_option_id:b.dataset.option}; draw(); await saveQ(q);}); hydratePrivateImages(root).catch(()=>{}); updateTimer(); };
  async function saveQ(q){ if(saving)return; saving=true; const el=document.querySelector('#save-status'); if(el)el.textContent='Saving…'; try{await studentApi.save({attemptQuestionId:q.attempt_question_id,selectedOptionId:q.saved_answer?.selected_option_id,flagged:!!q.saved_answer?.flagged}); if(el)el.textContent='Saved';}catch(e){if(el)el.textContent='Save failed — please try again.';}finally{saving=false;}}
  async function submitFlow(){const n=countUnanswered(payload.questions);if(n&&!confirm(`You still have ${n} unanswered questions.\n\nPress OK to submit anyway, or Cancel to return.`))return;await finish();}
  async function finish(){if(autoSubmitted)return;autoSubmitted=true;clearInterval(quizTimer);try{await studentApi.submit(attemptId);go(`/student/results/${attemptId}`);}catch(e){autoSubmitted=false;alert(e.message);}}
  function updateTimer(){const el=document.querySelector('#timer');if(!el)return;const r=remainingSeconds(payload.expires_at);el.textContent=`${String(Math.floor(r/60)).padStart(2,'0')}:${String(r%60).padStart(2,'0')}`;if(r<=0)finish();}
  clearInterval(quizTimer);quizTimer=setInterval(updateTimer,1000);draw();
}


async function practiceAttemptPage(attemptId) {
  if(!await requireProfile('student'))return;
  loading('Loading practice quiz…');
  let payload=await studentApi.practicePayload(attemptId);
  if(payload.status!=='in_progress')return go(`/student/practice/results/${attemptId}`);
  const config=practiceModeConfig(payload.mode);
  let index=0;
  let saving=false;
  let finishing=false;

  function answeredCount(){return (payload.questions||[]).filter(q=>q.saved_answer?.selected_option_id).length;}
  function draw(){
    const q=payload.questions[index];
    if(!q)return;
    const quickNavigator=payload.mode==='speed'?'':`<aside class="navigator"><h3>Jump to Question</h3><div class="nav-grid">${payload.questions.map((row,i)=>`<button class="nav-q ${navigatorState({current:i===index,answered:!!row.saved_answer?.selected_option_id,flagged:false})}" data-practice-i="${i}">${i+1}</button>`).join('')}</div><p class="muted small">${payload.questions.length-answeredCount()} unanswered</p></aside>`;
    const previous=payload.mode==='speed'?'':`<button id="practice-prev" class="btn ghost" ${index===0?'disabled':''}>Previous</button>`;
    const nextLabel=index===payload.questions.length-1?'Review / Submit':'Next';
    const next=payload.mode==='quick'?`<button id="practice-next" class="btn primary">${nextLabel}</button>`:'';
    const modeNote=payload.mode==='speed'?'Answer once and move forward — answers lock immediately.':'You can go back and change answers before submitting.';
    const layoutClass=payload.mode==='speed'?'exam-page speed-question-panel':'exam-page';
    root.innerHTML=`<header class="exam-top practice-top"><div><b>${escapeHtml(payload.title)}</b><span>Question ${index+1}/${payload.question_count}</span><div class="practice-progress"><span style="width:${Math.round(((index+1)/payload.question_count)*100)}%"></span></div></div><div id="timer" class="timer"></div></header><main class="${layoutClass}"><section class="question-panel"><div class="question-meta"><span class="subject-pill">${escapeHtml(payload.subject_name)}</span><span>${escapeHtml(config.label)}</span></div><div class="practice-mode-note">${escapeHtml(modeNote)}</div>${renderQuestion(q)}<div id="save-status" class="save-status" aria-live="polite"></div><div class="exam-actions">${previous}${next}</div>${payload.mode==='speed'?'<div class="speed-next-note">Choose an answer to continue.</div>':''}</section>${quickNavigator}</main>`;

    document.querySelector('#practice-prev')?.addEventListener('click',()=>{if(config.allowBacktrack&&index>0){index-=1;draw();}});
    document.querySelector('#practice-next')?.addEventListener('click',()=>{if(index<payload.questions.length-1){index+=1;draw();}else submitQuick();});
    document.querySelectorAll('[data-practice-i]').forEach(btn=>btn.addEventListener('click',()=>{if(config.allowBacktrack){index=Number(btn.dataset.practiceI);draw();}}));
    document.querySelectorAll('.option').forEach(btn=>btn.addEventListener('click',async()=>{
      if(saving)return;
      if(config.lockOnAnswer&&q.saved_answer?.selected_option_id)return;
      const status=document.querySelector('#save-status');
      saving=true;if(status)status.textContent='Saving…';
      if(payload.mode==='speed'){
        try{
          await studentApi.savePracticeAnswer(attemptId,q.challenge_question_id,btn.dataset.option);
          q.saved_answer={selected_option_id:btn.dataset.option};
          if(index<payload.questions.length-1){index += 1;draw();}
          else await finishPractice();
        }catch(error){if(status)status.textContent=error.message||'Save failed — try again.';}
        finally{saving=false;}
        return;
      }
      try{
        await studentApi.savePracticeAnswer(attemptId,q.challenge_question_id,btn.dataset.option);
        q.saved_answer={selected_option_id:btn.dataset.option};
        draw();
      }catch(error){if(status)status.textContent=error.message||'Save failed — try again.';}
      finally{saving=false;}
    }));
    hydratePrivateImages(root).catch(()=>{});
    updatePracticeTimer();
  }

  async function submitQuick(){
    const unanswered=payload.questions.length-answeredCount();
    if(unanswered&&!confirm(`You still have ${unanswered} unanswered question${unanswered===1?'':'s'}.\n\nSubmit anyway?`))return;
    await finishPractice();
  }
  async function finishPractice(){
    if(finishing)return;
    finishing=true;clearInterval(quizTimer);
    try{await studentApi.submitPractice(attemptId);go(`/student/practice/results/${attemptId}`);}
    catch(error){finishing=false;alert(error.message||'Unable to submit practice quiz.');}
  }
  function updatePracticeTimer(){
    const el=document.querySelector('#timer');if(!el)return;
    const remaining=remainingSeconds(payload.expires_at);
    el.textContent=`${String(Math.floor(remaining/60)).padStart(2,'0')}:${String(remaining%60).padStart(2,'0')}`;
    if(remaining<=0)finishPractice();
  }
  clearInterval(quizTimer);quizTimer=setInterval(updatePracticeTimer,1000);draw();
}

async function studentLeaderboard() {
  if(!await requireProfile('student'))return;
  loading('Loading leaderboards…');
  const hub=await studentApi.quizHub();
  studentIdentity=hub.profile||studentIdentity;
  let mode='simulation';

  async function draw(nextMode=mode){
    mode=nextMode;
    const simulationTargets=(hub.simulations||[]).map(x=>({id:x.setVersionId,label:x.title}));
    const practiceTargets=(hub.practiceSubjects||[]).map(subject=>({id:subject[mode]?.challengeId||'',label:subject.subjectName,subjectCode:subject.subjectCode}));
    const targets=mode==='simulation'?simulationTargets:practiceTargets;
    const usable=targets.filter(x=>x.id);
    const options=targets.map(x=>`<option value="${escapeHtml(x.id)}" ${x.id?'':'disabled'}>${escapeHtml(x.label)}${x.id?'':' · No leaderboard yet'}</option>`).join('');
    shell(`<div class="page-head"><div><span class="eyebrow">Best Score Counts</span><h1>Leaderboard</h1><p class="muted">Highest score wins. Ties go to the faster time.</p></div><a class="btn ghost" href="/student" data-link>Quiz Hub</a></div><section class="hub-panel"><div class="leaderboard-controls"><div class="leaderboard-tabs"><button class="btn ${mode==='simulation'?'primary':'ghost'} leaderboard-mode" data-mode="simulation">Full Simulation</button><button class="btn ${mode==='quick'?'primary':'ghost'} leaderboard-mode" data-mode="quick">Quick Quiz</button><button class="btn ${mode==='speed'?'primary':'ghost'} leaderboard-mode" data-mode="speed">Speed Quiz</button></div><select id="leaderboard-target" ${usable.length?'':'disabled'}>${options}</select></div><div id="leaderboard-body">${usable.length?'<div class="muted">Loading ranking…</div>':'<div class="empty-playful">No leaderboard exists for this mode yet. Start a quiz first.</div>'}</div></section>`);
    document.querySelectorAll('.leaderboard-mode').forEach(btn=>btn.addEventListener('click',()=>draw(btn.dataset.mode)));
    const select=document.querySelector('#leaderboard-target');
    select?.addEventListener('change',()=>loadBoard(select.value));
    if(usable.length){select.value=usable[0].id;await loadBoard(usable[0].id);}
  }

  async function loadBoard(targetId){
    const box=document.querySelector('#leaderboard-body');if(!box||!targetId)return;
    box.innerHTML='<div class="muted">Loading ranking…</div>';
    try{
      const data=mode==='simulation'?await studentApi.simulationLeaderboard(targetId):await studentApi.practiceLeaderboard(targetId);
      const top10=data.top10||[];
      const myPosition=data.myPosition||null;
      const rows=top10.map(row=>{
        const score=mode==='simulation'?`${pct(row.percentage)} · ${Number(row.rawScore||0)}/${Number(row.maxScore||0)}`:`${Number(row.correctCount||0)} correct · ${pct(row.percentage)}`;
        return `<tr><td><b>#${Number(row.rank||0)}</b></td><td><span class="leaderboard-avatar">${escapeHtml(row.avatarSymbol||'🎓')}</span>${escapeHtml(row.nickname||'Student')}</td><td>${escapeHtml(score)}</td><td>${formatDuration(row.elapsedSeconds||0)}</td></tr>`;
      }).join('');
      const mine=myPosition?`<div class="my-position-card"><b>Your position: #${Number(myPosition.rank||0)}</b><div class="muted small">${mode==='simulation'?`${pct(myPosition.percentage)} · ${formatDuration(myPosition.elapsedSeconds||0)}`:`${Number(myPosition.correctCount||0)} correct · ${pct(myPosition.percentage)} · ${formatDuration(myPosition.elapsedSeconds||0)}`}</div></div>`:'';
      box.innerHTML=top10.length?`<div class="table-wrap"><table class="leaderboard-table"><thead><tr><th>Rank</th><th>Student</th><th>Score</th><th>Time</th></tr></thead><tbody>${rows}</tbody></table></div>${mine}`:`<div class="empty-playful">No completed attempts on this leaderboard yet.</div>${mine}`;
    }catch(error){box.innerHTML=`<div class="set-alert error">${escapeHtml(error.message||'Unable to load leaderboard.')}</div>`;}
  }

  await draw('simulation');
}

    actions.push(`<button class="link-btn reference-analyse" data-id="${id}">Analyze</button>`);
    actions.push(`<a href="/admin/references/${id}" data-link>View</a>`);

    actions.push(`<button class="link-btn reference-analyse" data-id="${id}">Re-analyze</button>`);
  }else if(status==='failed'){
    actions.push(`<button class="link-btn reference-analyse" data-id="${id}">Retry Analysis</button>`);
    actions.push(`<a href="/admin/references/${id}" data-link>View</a>`);
  }else if(status==='archived'){

  }

  if(status!=='archived') actions.push(`<button class="link-btn reference-archive" data-id="${id}">Archive</button>`);
  return actions.join('<span class="muted">·</span>');
}

function referenceUploadModal(taxonomy){
  const wrap=document.createElement('div');
  wrap.className='modal-backdrop';
  const subjectOptions=(taxonomy.subjects||[]).map(s=>`<option value="${escapeHtml(s.id)}">${escapeHtml(s.name)}</option>`).join('');
  wrap.innerHTML=`<div class="modal"><h2>Upload Reference PDF</h2><p class="muted">The PDF stays private. AI will analyse visible source questions and keep page provenance for Admin review.</p><form id="reference-upload-form"><label>Title<input id="reference-upload-title" maxlength="200" required placeholder="Reference title"></label><label>Subject hint <span class="muted small">(optional)</span><select id="reference-upload-subject"><option value="">Auto-detect / mixed subjects</option>${subjectOptions}</select></label><label class="reference-upload-drop">PDF file <span class="muted small">PDF only · maximum 20 MB</span><input id="reference-upload-file" type="file" accept="application/pdf,.pdf" required></label><div id="reference-upload-error" class="form-error" aria-live="polite"></div><div id="reference-upload-progress" class="reference-upload-progress" hidden><div class="reference-progress-step" data-step="record">○ Creating record…</div><div class="reference-progress-step" data-step="upload">○ Uploading PDF…</div><div class="reference-progress-step" data-step="analyse">○ Analysing PDF…</div></div><div class="modal-actions"><button type="button" id="reference-upload-cancel" class="btn ghost">Cancel</button><button type="submit" class="btn primary">Upload &amp; Analyse</button></div></form></div>`;
  document.body.append(wrap);
  const form=wrap.querySelector('#reference-upload-form');
  const fileInput=wrap.querySelector('#reference-upload-file');
  const titleInput=wrap.querySelector('#reference-upload-title');
  const error=wrap.querySelector('#reference-upload-error');
  const progress=wrap.querySelector('#reference-upload-progress');
  const submit=form.querySelector('button[type="submit"]');
  wrap.querySelector('#reference-upload-cancel').onclick=()=>wrap.remove();
  fileInput.addEventListener('change',()=>{
    const file=fileInput.files?.[0];
    if(file&&!titleInput.value.trim()) titleInput.value=file.name.replace(/\.pdf$/i,'');
  });
  function setProgress(step){
    progress.hidden=false;
    const order=['record','upload','analyse'];
    const active=order.indexOf(step);
    progress.querySelectorAll('[data-step]').forEach((el,i)=>{
      el.classList.toggle('active',i===active);
      el.classList.toggle('done',i<active);
      el.textContent=`${i<active?'✓':i===active?'●':'○'} ${['Creating record…','Uploading PDF…','Analysing PDF…'][i]}`;
    });
  }
  form.addEventListener('submit',async e=>{
    e.preventDefault();
    error.textContent='';
    const file=fileInput.files?.[0];
    const errors=validateReferencePdf(file);
    if(errors.length){error.textContent=errors.join(' ');return;}
    const title=titleInput.value.trim();
    if(!title){error.textContent='Document title is required.';return;}
    submit.disabled=true;wrap.querySelector('#reference-upload-cancel').disabled=true;
    try{
      setProgress('record');
      const created=await adminApi.createReferenceDocument({
        title,
        originalFilename:file.name,
        subjectHintId:wrap.querySelector('#reference-upload-subject').value||null,
        fileSizeBytes:file.size,
      });
      try{
        setProgress('upload');
        await adminApi.uploadReferencePdf(created.storagePath,file);
      }catch(err){
        throw new Error(`Metadata was created but PDF upload failed: ${err.message}`);
      }
      setProgress('analyse');
      try{
        await adminApi.processReferenceDocument(created.documentId);
      }catch(err){
        // Processing failure is persisted by the Edge Function; detail page shows the failure.
      }
      wrap.remove();
      go(`/admin/references/${created.documentId}`);
    }catch(err){
      error.textContent=err.message||'Unable to upload reference PDF.';
      submit.disabled=false;wrap.querySelector('#reference-upload-cancel').disabled=false;
    }
  });
}

function referenceEditModal(row,taxonomy,onSaved){
  const wrap=document.createElement('div');wrap.className='modal-backdrop';
  const subjectOptions=(taxonomy.subjects||[]).map(s=>`<option value="${escapeHtml(s.id)}" ${s.id===row.subjectHintId?'selected':''}>${escapeHtml(s.name)}</option>`).join('');
  wrap.innerHTML=`<div class="modal"><h2>Edit Reference Details</h2><form id="reference-edit-form"><label>Title<input id="reference-edit-title" maxlength="200" required value="${escapeHtml(row.title||'')}"></label><label>Subject hint <span class="muted small">(optional)</span><select id="reference-edit-subject"><option value="">Auto-detect / mixed subjects</option>${subjectOptions}</select></label><div id="reference-edit-error" class="form-error"></div><div class="modal-actions"><button type="button" id="reference-edit-cancel" class="btn ghost">Cancel</button><button type="submit" class="btn primary">Save Changes</button></div></form></div>`;
  document.body.append(wrap);
  wrap.querySelector('#reference-edit-cancel').onclick=()=>wrap.remove();
  wrap.querySelector('#reference-edit-form').onsubmit=async e=>{
    e.preventDefault();const submit=e.currentTarget.querySelector('button[type="submit"]');const error=wrap.querySelector('#reference-edit-error');submit.disabled=true;error.textContent='';
    try{
      await adminApi.updateReferenceDocument({documentId:row.documentId,title:wrap.querySelector('#reference-edit-title').value.trim(),subjectHintId:wrap.querySelector('#reference-edit-subject').value||null});
      wrap.remove();await onSaved();
    }catch(err){error.textContent=err.message||'Unable to update reference details.';submit.disabled=false;}
  };
}

async function referenceLibraryPage(){
  if(!await requireProfile('admin'))return;
  loading('Loading Reference Library…');
  const [rows,taxonomy]=await Promise.all([adminApi.referenceDocuments(),adminApi.taxonomy()]);
  const activeRows=(rows||[]);
  const body=activeRows.length?activeRows.map(row=>{
    const status=String(row.status||'uploaded');
    const review=Number(row.needsReviewCount||0);
    const statusCell=status==='processing'?`<div>${referenceStatusPill(status)}</div><div class="muted small" style="margin-top:5px">Processing…</div>`:referenceStatusPill(status);
    return `<tr><td><b>${escapeHtml(row.title||row.originalFilename||'Reference PDF')}</b><div class="reference-doc-meta"><span>${escapeHtml(row.originalFilename||'')}</span><span>${formatBytes(row.fileSizeBytes)}</span></div></td><td>${escapeHtml(row.subjectHintName||'Auto / mixed')}</td><td>${statusCell}${row.processingError?`<div class="form-error small" style="margin-top:5px">${escapeHtml(row.processingError)}</div>`:''}</td><td>${row.pageCount??'—'}</td><td>${Number(row.sourceQuestionCount||0)}</td><td>${review?`<span class="reference-status warning">${review} need review</span>`:'—'}</td><td>${date(row.updatedAt)}</td><td><div class="reference-actions">${referenceActionsMarkup(row)}</div></td></tr>`;
  }).join(''):`<tr><td colspan="8"><div class="reference-empty">No reference PDFs yet. Upload your first PKSK source document.</div></td></tr>`;
  shell(`<div class="page-head"><div><span class="eyebrow">AI Source Material</span><h1>Reference Library</h1><p class="muted">Upload private PKSK PDFs for AI source analysis.</p></div><button id="reference-upload-open" class="btn primary">Upload Reference PDF</button></div><section class="card"><div class="table-wrap"><table class="reference-table"><thead><tr><th>Document</th><th>Subject Hint</th><th>Status</th><th>Pages</th><th>Sources</th><th>Review</th><th>Updated</th><th>Actions</th></tr></thead><tbody>${body}</tbody></table></div></section>`,'admin');
  bindLinks();
  document.querySelector('#reference-upload-open').onclick=()=>referenceUploadModal(taxonomy);
  const rowById=new Map(activeRows.map(row=>[row.documentId,row]));
  document.querySelectorAll('.reference-view-pdf').forEach(btn=>btn.addEventListener('click',async()=>{
    btn.disabled=true;
    try{const url=await adminApi.referencePdfUrl(btn.dataset.path);window.open(url,'_blank','noopener');}
    catch(err){alert(err.message||'Unable to open the private PDF.');}
    finally{btn.disabled=false;}
  }));
  document.querySelectorAll('.reference-analyse').forEach(btn=>btn.addEventListener('click',async()=>{
    btn.disabled=true;const old=btn.textContent;btn.textContent='Analysing…';
    try{await adminApi.processReferenceDocument(btn.dataset.id);}catch(err){/* persisted failure is shown after reload */}
    finally{btn.textContent=old;await render();}
  }));
  document.querySelectorAll('.reference-edit').forEach(btn=>btn.addEventListener('click',()=>{
    const row=rowById.get(btn.dataset.id);if(row)referenceEditModal(row,taxonomy,async()=>render());
  }));
  document.querySelectorAll('.reference-archive').forEach(btn=>btn.addEventListener('click',async()=>{
    if(!confirm('Archive this reference document? It will be hidden from future AI generation, but the PDF and historical provenance will be preserved.'))return;
    btn.disabled=true;
    try{await adminApi.archiveReferenceDocument(btn.dataset.id);await render();}
    catch(err){alert(err.message||'Unable to archive the reference document.');btn.disabled=false;}
  }));
}


async function referenceDocumentPage(documentId){
  if(!await requireProfile('admin'))return;
  loading('Loading reference analysis…');
  let data=await adminApi.referenceDocument(documentId);
  const status=String(data.status||'uploaded');
  const archived=status==='archived';
  const processing=status==='processing';
  const mayProcess=!archived&&!processing&&['uploaded','failed','ready','needs_review'].includes(status);
  const processLabel=status==='failed'?'Retry Analysis':status==='uploaded'?'Analyze Now':'Re-analyse';
  let notice='';
  if(status==='uploaded') notice=`<div class="reference-notice neutral">PDF uploaded and waiting for analysis.</div>`;
  if(status==='processing') notice=`<div class="reference-notice warning">Analysis is in progress. If this page was reopened after an interrupted request, wait briefly and refresh before retrying.</div>`;
  if(status==='failed') notice=`<div class="reference-notice error"><b>Analysis failed.</b><div style="margin-top:5px">${escapeHtml(data.processingError||'Reference analysis failed.')}</div></div>`;
  if(status==='needs_review') notice=`<div class="reference-notice warning"><b>Review needed.</b> One or more extracted source items need inspection before they should influence future AI generation.</div>`;
  if(status==='archived') notice=`<div class="reference-notice neutral"><b>Archived reference.</b> This document is read-only and will be excluded from future AI generation.</div>`;
  const processButton=mayProcess?`<button id="reference-process-now" class="btn ${status==='failed'?'ghost':'primary'}">${escapeHtml(processLabel)}</button>`:'';
  shell(`<div class="page-head"><div><span class="eyebrow">AI Source Analysis</span><h1>${escapeHtml(data.title||'Reference Document')}</h1><p class="muted">${escapeHtml(data.originalFilename||'')} · ${formatBytes(data.fileSizeBytes)}</p></div><div class="preview-actions"><button id="reference-detail-pdf" class="btn ghost">View PDF</button>${processButton}<a href="/admin/references" class="btn ghost" data-link>Back to Reference Library</a></div></div>${notice}<section class="card"><div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap"><div><h2 style="margin-top:0">Document</h2><div>${referenceStatusPill(status)}</div></div><div class="muted small">Processed: ${date(data.processedAt)}</div></div><div class="reference-detail-grid"><div class="stat"><b>${escapeHtml(data.subjectHintName||'Auto / mixed')}</b><span>Subject Hint</span></div><div class="stat"><b>${data.pageCount??'—'}</b><span>Pages</span></div><div class="stat"><b>${Number(data.sourceQuestionCount||0)}</b><span>Source Questions</span></div><div class="stat"><b>${Number(data.needsReviewCount||0)}</b><span>Need Review</span></div></div>${data.analysisSummary?.notes?`<p class="muted">${escapeHtml(data.analysisSummary.notes)}</p>`:''}</section><section class="card"><div class="set-total"><div><span class="eyebrow">Extracted Material</span><h2>Source Questions</h2></div><strong id="reference-source-count"></strong></div><div class="reference-filter-grid"><label>Search<input id="reference-source-search" type="search" placeholder="Prompt, skill or source label"></label><label>Review status<select id="reference-source-review"><option value="all">All</option><option value="pass">Pass</option><option value="needs_review">Needs Review</option></select></label><label class="reference-check-label"><input id="reference-source-ignored" type="checkbox"> Include ignored</label></div><div id="reference-source-list" class="reference-source-list"></div></section>`,'admin');
  bindLinks();

  document.querySelector('#reference-detail-pdf').onclick=async e=>{
    const btn=e.currentTarget;btn.disabled=true;
    try{const url=await adminApi.referencePdfUrl(data.storagePath);window.open(url,'_blank','noopener');}
    catch(err){alert(err.message||'Unable to open the private PDF.');}
    finally{btn.disabled=false;}
  };

  document.querySelector('#reference-process-now')?.addEventListener('click',async e=>{
    if((status==='ready'||status==='needs_review')&&!confirm('Re-analyse this PDF? Existing extracted source-question rows for this document will be replaced, but the document ID and PDF will stay the same.'))return;
    const btn=e.currentTarget;btn.disabled=true;btn.textContent='Analysing…';
    try{await adminApi.processReferenceDocument(documentId);}catch(err){/* failure is persisted for the refreshed detail */}
    await referenceDocumentPage(documentId);
  });

  const filters={search:'',review:'all',includeIgnored:false};
  const sources=(data.sourceQuestions||[]).map(source=>({...source}));

  function sourceCard(source){
    const analysis=source.analysis||{};
    const review=sourceReviewStatus(source);
    const chips=[];
    if(review==='needs_review')chips.push('<span class="reference-chip warning">Needs Review</span>');
    else chips.push('<span class="reference-chip">QA Pass</span>');
    if(analysis.sourceConcern)chips.push('<span class="reference-chip error">Source concern</span>');
    if(analysis.imageDependent)chips.push('<span class="reference-chip warning">Image dependent</span>');
    if(analysis.lowConfidence)chips.push('<span class="reference-chip warning">Low confidence</span>');
    if(source.isIgnored)chips.push('<span class="reference-chip">Ignored</span>');
    const options=Array.isArray(source.options)&&source.options.length?`<div class="reference-options">${source.options.map(o=>`<div class="reference-option"><b>${escapeHtml(o.key||'')}</b>. ${escapeHtml(o.text||'')}</div>`).join('')}</div>`:'';
    const answer=source.answerText?`<details><summary>Source answer</summary><p>${escapeHtml(source.answerText)}</p></details>`:'';
    const toggle=archived?'':`<button class="btn ghost reference-source-toggle" data-id="${escapeHtml(source.id)}">${source.isIgnored?'Include Source':'Mark Ignored'}</button>`;
    return `<article class="reference-source-card ${source.isIgnored?'ignored':''}"><div class="reference-source-head"><div><b>Page ${Number(source.pageNo||0)} · ${escapeHtml(source.sourceLabel||'Source item')}</b><div class="reference-source-meta"><span>${escapeHtml(source.subjectName||source.subjectCode||'Unmapped subject')}</span><span>·</span><span>${escapeHtml(source.topicName||'Unmapped topic')}</span><span>·</span><span>${escapeHtml(source.difficulty?String(source.difficulty).replace(/^./,c=>c.toUpperCase()):'Unrated')}</span></div></div><div>${chips.join(' ')}</div></div><p class="reference-source-prompt">${escapeHtml(source.promptText||'[Prompt requires source-page inspection]')}</p>${options}<div class="reference-source-analysis"><div class="reference-analysis-item"><span>Tested Skill</span><b>${escapeHtml(analysis.testedSkill||'Unclassified')}</b></div><div class="reference-analysis-item"><span>Reasoning</span><b>${escapeHtml(analysis.reasoningPattern||'Unclassified')}</b></div><div class="reference-analysis-item"><span>Reasoning Steps</span><b>${Number.isInteger(analysis.reasoningSteps)?analysis.reasoningSteps:'—'}</b></div><div class="reference-analysis-item"><span>Difficulty rationale</span><b>${escapeHtml(analysis.difficultyRationale||'—')}</b></div></div>${analysis.notes?`<p class="muted"><b>AI note:</b> ${escapeHtml(analysis.notes)}</p>`:''}${answer}<div class="reference-source-footer"><span class="muted small">Source language: ${escapeHtml(analysis.sourceLanguage||'Unknown')}</span>${toggle}</div></article>`;
  }

  function filteredSources(){
    const term=filters.search.toLowerCase();
    return sources.filter(source=>{
      if(!filters.includeIgnored&&source.isIgnored)return false;
      const review=sourceReviewStatus(source);
      if(filters.review!=='all'&&review!==filters.review)return false;
      if(term){
        const hay=[source.promptText,source.sourceLabel,source.subjectName,source.topicName,source.analysis?.testedSkill,source.analysis?.reasoningPattern].filter(Boolean).join(' ').toLowerCase();
        if(!hay.includes(term))return false;
      }
      return true;
    });
  }

  function renderSources(){
    const visible=filteredSources();
    document.querySelector('#reference-source-count').textContent=`${visible.length} shown`;
    document.querySelector('#reference-source-list').innerHTML=visible.length?visible.map(sourceCard).join(''):`<div class="reference-empty">No source questions match these filters.</div>`;
    document.querySelectorAll('.reference-source-toggle').forEach(btn=>btn.addEventListener('click',async()=>{
      const source=sources.find(item=>item.id===btn.dataset.id);if(!source)return;
      btn.disabled=true;
      try{
        await adminApi.setReferenceSourceIgnored(source.id,!source.isIgnored);
        source.isIgnored=!source.isIgnored;
        renderSources();
      }catch(err){alert(err.message||'Unable to update source status.');btn.disabled=false;}
    }));
  }

  document.querySelector('#reference-source-search').addEventListener('input',e=>{filters.search=e.target.value.trim();renderSources();});
  document.querySelector('#reference-source-review').addEventListener('change',e=>{filters.review=e.target.value;renderSources();});
  document.querySelector('#reference-source-ignored').addEventListener('change',e=>{filters.includeIgnored=e.target.checked;renderSources();});
  renderSources();
}

function generationStatusMeta(status='draft'){
  return ({
    draft:{label:'Draft',tone:'draft'},planning:{label:'Planning',tone:'draft'},plan_ready:{label:'Plan Ready',tone:'published'},
    approved:{label:'Approved',tone:'published'},failed:{label:'Failed',tone:'archived'},generating:{label:'Generating',tone:'draft'},
    review_ready:{label:'Review Ready',tone:'published'},completed:{label:'Completed',tone:'published'},cancelled:{label:'Cancelled',tone:'archived'},
  })[status]||{label:String(status||'Unknown'),tone:'archived'};
}

function generationJobAction(status){
  if(status==='plan_ready')return 'Review Plan';
  if(status==='approved')return 'Start Generation';
  if(status==='generating')return 'Resume Generation';
  if(status==='review_ready')return 'Review Candidates';
  if(status==='planning')return 'Open';
  return 'Open & Plan';
}

async function generationCoveragePage(){
  if(!await requireProfile('admin'))return;
  loading('Loading Question Coverage…');
  const coverage=await adminApi.questionPoolCoverage(null);
  const subjects=coverage.subjects||[];
  const totalShortage=subjects.reduce((n,row)=>n+Number(row.poolShortage||0),0);
  const ready=totalShortage===0;
  const diff=coverage.publishedDifficulty||{};
  const topicBySubject=new Map();
  for(const row of coverage.topicCoverage||[]){
    if(!topicBySubject.has(row.subjectCode))topicBySubject.set(row.subjectCode,[]);
    topicBySubject.get(row.subjectCode).push(row);
  }
  const rows=subjects.map(row=>`<tr class="${Number(row.poolShortage)>0?'shortage':'complete'}"><td><b>${escapeHtml(row.subjectName)}</b></td><td>${Number(row.required)}</td><td>${Number(row.publishedAvailable)}</td><td>${Number(row.aiDrafts)}</td><td>${Number(row.aiPublished)}</td><td><span class="availability-badge ${Number(row.poolShortage)>0?'short':''}">${Number(row.poolShortage)}</span></td></tr>`).join('');
  const topics=subjects.map(row=>{const list=topicBySubject.get(row.subjectCode)||[];return `<div class="card" style="box-shadow:none;margin:8px 0"><b>${escapeHtml(row.subjectName)}</b><p class="muted small">${list.length?list.map(t=>`${escapeHtml(t.topicName)}: ${Number(t.publishedCount)}`).join(' · '):'No Published topic coverage yet.'}</p></div>`;}).join('');
  shell(`<div class="page-head"><div><span class="eyebrow">Milestone 3E</span><h1>Coverage Assistant</h1><p class="muted">Checks whether the <b>Published Question Bank</b> can fill one standard 100-question PKSK set.</p></div><a class="btn ghost" href="/admin/generator" data-link>Back to Generator</a></div>
  <div class="reference-notice ${ready?'neutral':'warning'}"><b>${ready?'Published pool is ready for one standard set.':'Published pool has real shortages.'}</b> ${ready?'No new generation is required for subject quotas.':'Generate only the missing pool questions below; existing Published questions are never replaced by unnecessary AI generation.'}</div>
  <section class="card"><div class="set-total"><div><span class="eyebrow">Published Pool</span><h2>Subject Readiness</h2></div><strong>${ready?'Ready':`${totalShortage} missing`}</strong></div><div class="table-wrap"><table class="set-quota-table"><thead><tr><th>Subject</th><th>Required</th><th>Published Pool</th><th>AI Drafts</th><th>AI Published</th><th>Pool Shortage</th></tr></thead><tbody>${rows}</tbody></table></div><div class="generator-actions" style="margin-top:16px"><button id="coverage-generate" class="btn primary" ${ready?'disabled':''}>Generate Missing Questions</button><a class="btn ghost" href="/admin/questions" data-link>Open Question Bank</a></div><div id="coverage-result" class="generator-review-result"></div></section>
  <section class="card"><h2>Published Difficulty Mix</h2><p class="muted small">Advisory target for a standard set: 20 Easy / 55 Medium / 25 Hard. Subject quota readiness above remains the hard gate.</p><div class="difficulty-grid"><div class="difficulty-box"><span>Easy</span><b>${Number(diff.easy||0)} / 20</b></div><div class="difficulty-box"><span>Medium</span><b>${Number(diff.medium||0)} / 55</b></div><div class="difficulty-box"><span>Hard</span><b>${Number(diff.hard||0)} / 25</b></div></div></section>
  <section class="card"><h2>Topic Coverage</h2>${topics}</section>`,'admin');
  bindLinks();
  document.querySelector('#coverage-generate')?.addEventListener('click',async e=>{
    const btn=e.currentTarget;btn.disabled=true;const result=document.querySelector('#coverage-result');result.innerHTML='';
    try{
      const refs=await loadGeneratorReferences();
      const usableIds=refs.filter(r=>Number(r.eligibleSourceCount||0)>0).map(r=>r.documentId);
      const payload=buildGapGenerationDraft(coverage,usableIds);
      if(!payload.totalQuestions)throw new Error('The Published pool has no subject shortage.');
      const created=await adminApi.createGenerationJob(payload);
      try{await adminApi.planGenerationJob(created.jobId);}catch{/* planner persists its own failure */}
      go(`/admin/generator/${created.jobId}`);
    }catch(err){result.innerHTML=`<div class="set-alert error">${escapeHtml(err.message||'Unable to create the gap-generation plan.')}</div>`;btn.disabled=false;}
  });
}

async function loadGeneratorReferences(){
  const rows=(await adminApi.referenceDocuments()||[]).filter(row=>['ready','needs_review'].includes(String(row.status)));
  return Promise.all(rows.map(async row=>{
    try{
      const detail=await adminApi.referenceDocument(row.documentId);
      const eligible=(detail.sourceQuestions||[]).filter(source=>!source.isIgnored&&sourceReviewStatus(source)==='pass').length;
      return {...row,eligibleSourceCount:eligible};
    }catch{return {...row,eligibleSourceCount:0};}
  }));
}

function generatorSubjectRows(draft){
  return (draft.subjects||[]).map(row=>`<tr><td><b>${escapeHtml(SUBJECT_LABELS[row.subjectCode]||row.subjectCode)}</b></td><td><input class="gen-subject-count" data-code="${escapeHtml(row.subjectCode)}" type="number" min="0" max="200" value="${Number(row.questionCount||0)}"></td><td><select class="gen-source-policy" data-code="${escapeHtml(row.subjectCode)}"><option value="pdf_only" ${row.sourcePolicy==='pdf_only'?'selected':''}>PDF only</option><option value="pdf_led" ${row.sourcePolicy==='pdf_led'?'selected':''}>PDF-led</option><option value="hybrid" ${row.sourcePolicy==='hybrid'?'selected':''}>Hybrid</option><option value="external_allowed" ${row.sourcePolicy==='external_allowed'?'selected':''}>External knowledge allowed</option></select></td></tr>`).join('');
}

function generatorManualTopicsMarkup(draft,taxonomy){
  const selected=(draft.subjects||[]).filter(s=>Number(s.questionCount)>0);
  return selected.map(subject=>{
    const topics=(taxonomy.topics||[]).filter(t=>t.subject_id===subject.subjectId||t.subject_code===subject.subjectCode||t.subjectCode===subject.subjectCode);
    if(!topics.length)return `<div class="reference-notice warning">No active topics are configured for ${escapeHtml(SUBJECT_LABELS[subject.subjectCode]||subject.subjectCode)}.</div>`;
    const existing=new Map((draft.manualTopicQuotas||[]).filter(q=>q.subjectCode===subject.subjectCode).map(q=>[q.topicId,Number(q.questionCount)||0]));
    return `<div class="card" style="box-shadow:none;margin:10px 0"><b>${escapeHtml(SUBJECT_LABELS[subject.subjectCode]||subject.subjectCode)} · ${Number(subject.questionCount)} questions</b><div class="muted small">Allocate exactly ${Number(subject.questionCount)} across topics.</div>${topics.map(t=>`<div class="generator-manual-topic"><label>${escapeHtml(t.name)}<input class="gen-topic-count" data-subject="${escapeHtml(subject.subjectCode)}" data-topic="${escapeHtml(t.id)}" type="number" min="0" max="200" value="${existing.get(t.id)||0}"></label></div>`).join('')}</div>`;
  }).join('');
}

async function generationReviewPage(jobId){

  const filters={search:'',subjectCode:'',topicId:'',difficulty:'',qaStatus:'',sourceDocumentId:'',variationMode:''};
  const selected=new Set();

  const uniq=(values)=>[...new Set(values.filter(Boolean))];
  const subjects=uniq(candidates.map(c=>c.subjectCode)).sort();
  const topics=uniq(candidates.map(c=>c.topicId)).map(id=>({id,name:candidates.find(c=>c.topicId===id)?.topicName||'AI skill'})).sort((a,b)=>a.name.localeCompare(b.name));
  const sources=uniq(candidates.map(c=>c.sourceRef?.documentId)).map(id=>({id,title:candidates.find(c=>c.sourceRef?.documentId===id)?.sourceRef?.documentTitle||'Reference PDF'})).sort((a,b)=>a.title.localeCompare(b.title));

  shell(`<div class="page-head"><div><span class="eyebrow">Milestone 3D</span><h1>${escapeHtml(progress.name||'Generation Job')} · Review Queue</h1><p class="muted">Review staged AI candidates before they enter the Question Bank.</p></div><div class="generator-actions"><a href="/admin/generator/${jobId}" class="btn ghost" data-link>Back to Job</a><a href="/admin/questions" class="btn ghost" data-link>Question Bank</a></div></div>
  <div class="reference-notice neutral"><b>Staged review.</b> <b>Accept as Draft</b> creates a canonical <b>Question Bank Draft</b>. This review queue <b>never publishes automatically</b>; normal Question Bank publish validation still applies.</div>
  <section class="card"><div class="generator-review-filters">
    <label>Search<input id="gr-search" type="search" placeholder="Question, QA note, source…"></label>
    <label>Subject<select id="gr-subject"><option value="">All subjects</option>${subjects.map(code=>`<option value="${escapeHtml(code)}">${escapeHtml(SUBJECT_LABELS[code]||code)}</option>`).join('')}</select></label>
    <label>Topic<select id="gr-topic"><option value="">All topics</option>${topics.map(t=>`<option value="${escapeHtml(t.id)}">${escapeHtml(t.name)}</option>`).join('')}</select></label>
    <label>Difficulty<select id="gr-difficulty"><option value="">All levels</option><option value="easy">Easy</option><option value="medium">Medium</option><option value="hard">Hard</option></select></label>
    <label>QA status<select id="gr-status"><option value="">All review statuses</option><option value="pass">QA Pass</option><option value="needs_review">Needs Review</option><option value="accepted">Accepted</option><option value="rejected">Rejected</option><option value="failed">Failed</option></select></label>
    <label>Source document<select id="gr-source"><option value="">All sources</option><option value="__fresh__">Fresh AI</option>${sources.map(d=>`<option value="${escapeHtml(d.id)}">${escapeHtml(d.title)}</option>`).join('')}</select></label>
    <label>Variation mode<select id="gr-variation"><option value="">All modes</option><option value="close_variant">Close Variant</option><option value="fresh_variant">Fresh Variant</option><option value="mixed">Mixed</option></select></label>
  </div>
  <div class="generator-review-toolbar"><div><b id="gr-count"></b> <span class="muted small" id="gr-selected-count"></span></div><div class="generator-review-actions"><button id="gr-accept-selected" class="btn ghost" disabled>Accept Selected</button><button id="gr-publish-selected" class="btn primary" disabled>Publish Selected Drafts</button><button id="gr-regenerate-selected" class="btn ghost" disabled>Regenerate Selected</button><button id="gr-reject-selected" class="btn ghost" disabled>Reject Selected</button></div></div><div class="muted small">Publish Selected Drafts uses the <b>normal Question Bank validation</b> for every question and reports partial success.</div><div id="gr-result" class="generator-review-result"></div></section>
  <section id="gr-list" class="generator-candidate-list"></section>`,'admin');
  bindLinks();

  const qaLabel=status=>({pass:'QA Pass',needs_review:'Needs Review',rejected:'Rejected',failed:'Failed',accepted:'Accepted'})[status]||String(status||'Unknown');
  const score=(label,value)=>`<div class="reference-analysis-item"><span>${escapeHtml(label)}</span><b>${escapeHtml(value?String(value).replace(/^./,c=>c.toUpperCase()):'—')}</b></div>`;
  const sourceSummary=c=>c.sourceRef?`${c.sourceRef.documentTitle||'Reference PDF'} · page ${Number(c.sourceRef.pageNo||0)}${c.sourceRef.sourceLabel?` · ${c.sourceRef.sourceLabel}`:''}`:'Fresh AI / no direct PDF source';
  const actionEligible=(c,action)=>action==='accept'?['pass','needs_review'].includes(c.status):action==='regenerate'?['pass','needs_review','rejected','failed'].includes(c.status):action==='reject'?['pass','needs_review','failed','rejected'].includes(c.status):false;

  function effectiveFilter(){
    return {...filters,sourceDocumentId:filters.sourceDocumentId==='__fresh__'?null:filters.sourceDocumentId,_freshOnly:filters.sourceDocumentId==='__fresh__'};
  }
  function visibleCandidates(){
    const f=effectiveFilter();
    let rows=filterGeneratedCandidates(candidates,f);
    if(f._freshOnly)rows=rows.filter(c=>!c.sourceRef?.documentId);
    return rows;
  }
  function card(c){
    const g=c.generated||{},qa=c.qa||{},scores=qa.scores||{};
    const canSelect=c.status!=='accepted'||c.questionVersionStatus==='draft';
    const statusTone=c.status==='needs_review'?'warning':c.status==='rejected'||c.status==='failed'?'error':'';
    const options=Array.isArray(g.options)?g.options.map(o=>`<div class="reference-option"><b>${escapeHtml(o.key||'')}</b>. ${escapeHtml(o.textMs||o.textEn||'')}${o.textMs&&o.textEn?`<div class="translation">${escapeHtml(o.textEn)}</div>`:''}</div>`).join(''):'';
    const answer=g.correctKey?`<details><summary>Admin answer + explanation</summary><p><b>Correct:</b> ${escapeHtml(g.correctKey)}</p>${g.explanationMs?`<p>${escapeHtml(g.explanationMs)}</p>`:''}${g.explanationEn?`<p class="translation">${escapeHtml(g.explanationEn)}</p>`:''}</details>`:'';
    const accepted=c.status==='accepted';
    const acceptedPublished=accepted&&c.questionVersionStatus==='published';
    const acceptButton=actionEligible(c,'accept')?`<button class="btn primary gr-action" data-action="accept" data-id="${escapeHtml(c.itemId)}">Accept as Draft</button>`:'';
    const editButton=acceptedPublished?`<a class="btn ghost" href="/admin/questions/${escapeHtml(c.questionId)}/preview" data-link>Preview Published</a>`:accepted?`<a class="btn ghost" href="/admin/questions/${escapeHtml(c.questionId)}/edit" data-link>Edit Draft</a>`:actionEligible(c,'accept')?`<button class="btn ghost gr-action" data-action="edit" data-id="${escapeHtml(c.itemId)}">Edit as Draft</button>`:'';
    const regenerateButton=c.status==='accepted'?'':actionEligible(c,'regenerate')?`<button class="btn ghost gr-action" data-action="regenerate" data-id="${escapeHtml(c.itemId)}">Regenerate</button>`:'';
    const rejectButton=c.status==='accepted'?'':actionEligible(c,'reject')?`<button class="btn ghost gr-action" data-action="reject" data-id="${escapeHtml(c.itemId)}">Reject</button>`:'';
    return `<article class="reference-source-card generator-review-card ${selected.has(c.itemId)?'selected':''}" data-item="${escapeHtml(c.itemId)}"><div class="reference-source-head"><div><label class="generator-review-select">${canSelect?`<input class="gr-select" type="checkbox" data-id="${escapeHtml(c.itemId)}" ${selected.has(c.itemId)?'checked':''}>`:''}<span><span class="generator-review-question-code">${escapeHtml(c.questionCode||`Candidate #${Number(c.slotNo||0)}`)}</span> · ${escapeHtml(c.subjectName||c.subjectCode||'')}</span></label><div class="reference-source-meta"><span>${escapeHtml(c.topicName||'AI skill')}</span><span>·</span><span>${escapeHtml(String(c.difficulty||'').replace(/^./,x=>x.toUpperCase()))}</span><span>·</span><span>${escapeHtml(String(c.variationMode||'mixed').replaceAll('_',' '))}</span></div></div><span class="reference-chip ${statusTone}">QA status: ${escapeHtml(qaLabel(c.status))}</span></div>${g.promptMs?`<p class="question-text">${escapeHtml(g.promptMs)}</p>`:''}${g.promptEn?`<p class="question-text translation">${escapeHtml(g.promptEn)}</p>`:''}<div class="reference-options">${options}</div>${answer}<div class="reference-source-analysis">${score('Correctness',scores.correctness)}${score('Uniqueness',scores.uniqueness)}${score('Difficulty',scores.difficulty)}${score('Distractor quality',scores.distractorQuality)}${score('Source alignment',scores.sourceAlignment)}${score('Clarity',scores.clarity)}</div><div class="generator-review-source"><b>Source:</b> ${escapeHtml(sourceSummary(c))}</div>${qa.notes?`<p class="muted"><b>QA note:</b> ${escapeHtml(qa.notes)}</p>`:''}${c.failureReason?`<div class="set-alert ${c.status==='rejected'||c.status==='failed'?'error':'warning'}">${escapeHtml(c.failureReason)}</div>`:''}${accepted?`<div class="set-alert success">Accepted as Question Bank ${acceptedPublished?'Published':'Draft'} ${escapeHtml(c.questionCode||'')}.</div>`:''}<div class="generator-review-card-actions">${acceptButton}${editButton}${regenerateButton}${rejectButton}</div></article>`;
  }

  function updateBulkButtons(){
    const count=selected.size;document.querySelector('#gr-selected-count').textContent=count?`· ${count} selected`:'';
    document.querySelector('#gr-accept-selected').disabled=!count;
    const publishable=[...selected].some(id=>{const c=candidates.find(x=>x.itemId===id);return c?.status==='accepted'&&c?.questionVersionStatus==='draft';});
    document.querySelector('#gr-publish-selected').disabled=!publishable;
    document.querySelector('#gr-regenerate-selected').disabled=!count;
    document.querySelector('#gr-reject-selected').disabled=!count;
  }
  function renderList(){
    const rows=visibleCandidates();
    document.querySelector('#gr-count').textContent=`${rows.length} candidate${rows.length===1?'':'s'}`;
    document.querySelector('#gr-list').innerHTML=rows.length?rows.map(card).join(''):'<div class="card generator-review-empty">No candidates match these filters.</div>';
    bindLinks();
    document.querySelectorAll('.gr-select').forEach(input=>input.addEventListener('change',()=>{if(input.checked)selected.add(input.dataset.id);else selected.delete(input.dataset.id);renderList();updateBulkButtons();}));
    document.querySelectorAll('.gr-action').forEach(btn=>btn.addEventListener('click',()=>runSingleAction(btn.dataset.action,btn.dataset.id,btn)));
    updateBulkButtons();
  }
  async function refreshReview(){
    progress=await adminApi.generationProgress(jobId);
    candidates=(progress.candidates||[]).map(c=>({...c}));
    for(const id of [...selected])if(!candidates.some(c=>c.itemId===id&&!(c.status==='accepted'&&c.questionVersionStatus==='published')))selected.delete(id);
    renderList();
  }
  function showResult(message,type='success'){document.querySelector('#gr-result').innerHTML=message?`<div class="set-alert ${escapeHtml(type)}">${escapeHtml(message)}</div>`:'';}

  async function runCandidateBulkAction(itemIds,action){
    const succeeded=[];const failed=[];
    for (const itemId of itemIds) {
      try{
        let result;
        if(action==='accept')result=await adminApi.acceptGeneratedCandidate(itemId);
        else if(action==='regenerate')result=await adminApi.regenerateGeneratedCandidate(itemId);
        else if(action==='reject')result=await adminApi.rejectGeneratedCandidate(itemId);
        else throw new Error('Unsupported review action');
        succeeded.push({itemId,result});
      }catch(error){failed.push({itemId,error:error?.message||String(error)});}
    }
    return {succeeded,failed};
  }
  async function runSingleAction(action,itemId,button){
    const candidate=candidates.find(c=>c.itemId===itemId);if(!candidate)return;
    if(action==='regenerate'&&!confirm('Regenerate this candidate? This uses the paid AI API and replaces the staged candidate after generation + QA.'))return;
    if(action==='reject'&&!confirm('Reject this candidate? The generated content stays in audit history but will not enter the Question Bank.'))return;
    button.disabled=true;showResult('');
    try{
      if(action==='edit'){
        const result=await adminApi.acceptGeneratedCandidate(itemId);
        go(`/admin/questions/${result.questionId}/edit`);
        return;
      }
      const result=action==='accept'?await adminApi.acceptGeneratedCandidate(itemId):action==='regenerate'?await adminApi.regenerateGeneratedCandidate(itemId):await adminApi.rejectGeneratedCandidate(itemId);
      selected.delete(itemId);
      await refreshReview();
      showResult(action==='accept'?`Accepted as Question Bank Draft ${result.questionCode||''}.`:action==='regenerate'?'Candidate queued for regeneration. Return to the job page and Resume Generation.':'Candidate rejected.');
    }catch(error){showResult(error.message||'Review action failed.','error');button.disabled=false;}
  }
  async function runBulk(action){
    const ids=[...selected].filter(id=>{const c=candidates.find(x=>x.itemId===id);return c&&actionEligible(c,action);});
    if(!ids.length){showResult(`None of the selected candidates can be ${action==='accept'?'accepted':action==='regenerate'?'regenerated':'rejected'}.`,'warning');return;}
    if(action==='regenerate'&&!confirm(`Regenerate ${ids.length} selected candidate(s)? This uses the paid AI API when you Resume Generation.`))return;
    if(action==='reject'&&!confirm(`Reject ${ids.length} selected candidate(s)?`))return;
    const result=await runCandidateBulkAction(ids,action);
    selected.clear();await refreshReview();
    const summary=`${result.succeeded.length} succeeded, ${result.failed.length} failed.`;
    const failures=result.failed.map(x=>`${x.itemId}: ${x.error}`).join(' · ');
    showResult(failures?`${summary} ${failures}`:summary,result.failed.length?'warning':'success');
  }

  async function publishSelectedDrafts(){
    const publishable=[...selected].map(id=>candidates.find(x=>x.itemId===id)).filter(candidate=>candidate?.status==='accepted'&&candidate?.questionVersionStatus==='draft'&&candidate?.questionVersionId);
    if(!publishable.length){showResult('Select at least one Accepted Draft to publish.','warning');return;}
    if(!confirm(`Publish ${publishable.length} accepted Draft(s)? Normal Question Bank validation will run for every question.`))return;
    const published=[];const failed=[];
    for(const candidate of publishable){
      try{await adminApi.publishQuestion(candidate.questionVersionId);published.push(candidate.questionCode||candidate.itemId);}
      catch(error){failed.push(`${candidate.questionCode||candidate.itemId}: ${error?.message||String(error)}`);}
    }
    selected.clear();await refreshReview();
    showResult(`${published.length} published, ${failed.length} failed.${failed.length?' '+failed.join(' · '):''}`,failed.length?'warning':'success');
  }

  const bindings=[['#gr-search','search','input'],['#gr-subject','subjectCode','change'],['#gr-topic','topicId','change'],['#gr-difficulty','difficulty','change'],['#gr-status','qaStatus','change'],['#gr-source','sourceDocumentId','change'],['#gr-variation','variationMode','change']];
  for(const [selector,key,event] of bindings)document.querySelector(selector).addEventListener(event,e=>{filters[key]=e.target.value.trim();renderList();});
  document.querySelector('#gr-accept-selected').onclick=()=>runBulk('accept');
  document.querySelector('#gr-publish-selected').onclick=publishSelectedDrafts;
  document.querySelector('#gr-regenerate-selected').onclick=()=>runBulk('regenerate');
  document.querySelector('#gr-reject-selected').onclick=()=>runBulk('reject');
  renderList();
}
