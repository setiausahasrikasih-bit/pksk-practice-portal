<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#6542b3">
<title>PKSK Pro · Visual IQ Challenge</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#222743;background:#f7f5ff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#fbe3f2 0,transparent 35%),radial-gradient(circle at 90% 15%,#d9efff 0,transparent 32%),#f7f5ff;min-height:100vh}
header{background:white;border-bottom:3px solid #dec6ff;position:sticky;top:0;z-index:9}
.header-inner{max-width:960px;margin:auto;padding:13px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-weight:900;font-size:1.1rem;color:#5437ab}.logo span{font-size:.85rem;color:#7b669f;display:block;font-weight:600}
.wrap{max-width:960px;margin:auto;padding:22px 16px 70px}
.card{background:#fff;border-radius:20px;padding:23px;border:1px solid #e5ddf2;box-shadow:0 12px 35px #58439312;margin:14px 0}
.hero{background:linear-gradient(130deg,#6044ae,#8b59b7,#c278b4);color:white;border-radius:22px;padding:27px}
.hero h1{margin:8px 0;font-size:clamp(1.65rem,5vw,2.5rem)}.hero p{margin:0;opacity:.95}
.btn{border:0;border-radius:12px;padding:12px 18px;cursor:pointer;font-weight:800;background:#ece7f9;color:#553f92;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn.primary{background:#6342b1;color:#fff}.btn.warn{background:#ee8b55;color:white}.btn:disabled{opacity:.45;cursor:wait}
.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:20px}.muted{color:#666880}.pill{border-radius:25px;background:#efebff;color:#6948a2;padding:6px 11px;font-size:.8rem;font-weight:800}
.bars{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:14px}.timer{font-variant-numeric:tabular-nums;background:#fff0d9;padding:8px 12px;border-radius:12px;font-weight:900}
.question-title{font-size:1.1rem;font-weight:800;line-height:1.6;margin:14px 0}.diagram{max-width:100%;overflow:auto}
.answers{display:grid;gap:11px;margin-top:18px}.answer{border:2px solid #e5dff0;border-radius:14px;background:white;display:flex;align-items:center;gap:14px;width:100%;padding:12px 15px;text-align:left;cursor:pointer;font:inherit}
.answer.selected{border-color:#7954cb;background:#f4edff}.answer:disabled{cursor:wait;opacity:.75}.answer .key{display:grid;place-items:center;background:#eae0ff;color:#6745ad;min-width:35px;height:35px;border-radius:9px;font-weight:900}
.answer .choice{font-weight:650;flex:1;white-space:normal;overflow-wrap:anywhere}.answer svg{max-width:100%;height:auto}
.nav{display:flex;flex-wrap:wrap;gap:7px}.nav button{width:35px;height:35px;padding:0;border-radius:9px;border:1px solid #cfc6e1;background:#f3eff9;font-weight:800;cursor:pointer}.nav .here{background:#6542b3;color:white}.nav .done{border-color:#58b388;background:#e3f9ec}
.review-row{border-left:5px solid #e66d71}.review-row.ok{border-left-color:#4caa80}.score{font-size:3rem;font-weight:900;color:#6342b1}
.translation{margin:8px 0;color:#73758c;font-size:.87rem;font-weight:500}
#status{min-height:18px;font-weight:650;color:#ad4242}
@media(max-width:560px){.card{padding:16px}.hero{padding:21px}.header-inner{padding:10px 14px}.answers{gap:9px}.btn{padding:11px 13px}}
</style>
</head>
<body>
<header><div class="header-inner"><div class="logo">🎓 PKSK Pro <span>Visual IQ & Pattern Recognition</span></div><a class="btn" href="/">← Quiz Hub</a></div></header>
<main class="wrap">
<section class="hero"><div>🧠 VISUAL IQ CHALLENGE · V1</div><h1>Cabaran IQ Visual</h1><p>Petak berlorek · Berlian nombor · Pola bentuk · Arah putaran</p></section>
<div id="app" class="card"><p class="muted">Menyediakan latihan…</p></div>
<p id="status" role="status" aria-live="polite"></p>
</main>
<script src="/visual-iq.js"></script>
<script>
(()=>{
'use strict';
const API='https://wwjtpfexvqaipvvupsai.supabase.co',KEY='sb_publishable_lsaVuFvTx6QlkMEb8a_nvQ_94YGD3F1',SESSION='pksk_session_v1',ACTIVE='pksk_visual_iq_attempt_v1';
const app=document.getElementById('app'),status=document.getElementById('status'),E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let data=null,at=0,busy=false,timer=null;
const setStatus=s=>status.textContent=s||'';
async function authToken(){
 let s=null;try{s=JSON.parse(localStorage.getItem(SESSION)||'null')}catch(_){}
 if(!s?.access_token)throw Error('Sila login di PKSK Pro dahulu, kemudian buka halaman ini semula.');
 const expiry=(Number(s.expires_at_ms)||Number(s.expires_at)*1000);
 if(Date.now()+20000<(expiry||0))return s.access_token;
 if(!s.refresh_token)throw Error('Sesi login telah tamat. Sila login semula.');
 const res=await fetch(API+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:s.refresh_token})});
 const p=await res.json();if(!res.ok||!p.access_token)throw Error('Sesi tamat. Sila login semula.');
 s={...p,expires_at_ms:(p.expires_at?Number(p.expires_at)*1000:Date.now()+Number(p.expires_in||3600)*1000)};
 localStorage.setItem(SESSION,JSON.stringify(s));return s.access_token;
}
async function rpc(name,body={}){
 const token=await authToken();const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),15000);
 try{
  const r=await fetch(API+'/rest/v1/rpc/'+name,{method:'POST',signal:controller.signal,headers:{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const v=await r.json().catch(()=>null);if(!r.ok)throw Error(v?.message||v?.error||'Tidak dapat menghubungi PKSK Pro');
  return v;
 }finally{clearTimeout(timeout)}
}
function diagram(q){
 const t=q.prompt_ms||'',paint=window.PKSK_VISUAL_IQ?.paint;
 if(!paint)return '';
 try{
  if(t.includes('Petak A:')){
   const m=t.match(/Petak A:\s*([■□\s/]+)\.\s*Petak B:\s*([■□\s/]+)/);
   if(m){const bits=s=>s.replace(/[^■□]/g,'').replace(/■/g,'1').replace(/□/g,'0');return paint({kind:'grid',left:bits(m[1]),right:bits(m[2])})}
  }
  if(t.includes('Kotak')||t.includes('Cari pola nombor kotak')){
   const groups=[...t.matchAll(/\[(\d+)\s*\|\s*(\d+)\]\s*→\s*(\d+|\?)/g)].map(x=>[Number(x[1]),Number(x[2]),x[3]]);
   if(groups.length===3)return paint({kind:'boxes',rows:groups});
  }
  if(t.includes('Berlian')){
   const groups=[...t.matchAll(/\[([0-9?,\s/]+)\]/g)].map(x=>x[1].split(/[\s,/]+/).filter(Boolean).map(z=>z==='?'?'?':Number(z)));
   if(groups.length>=4&&groups.every(a=>a.length===4))return paint({kind:'diamonds',items:groups.slice(0,4)});
  }
  if(t.includes('Pola arah:')){
   const m=t.match(/Pola arah:\s*([↑→↓←\s]+)\?/);
   const map={'↑':0,'→':90,'↓':180,'←':270};
   if(m){const dir=m[1].trim().split(' → ').map(x=>x.trim()).filter(Boolean);if(dir.length===3)return paint({kind:'arrows',angles:[...dir.map(x=>map[x]),'?']});}
  }
  if(t.includes('Susunan bentuk:')){
   const m=t.match(/Susunan bentuk:\s*([▲■●◆⬟★\s]+)\?/);
   const map={'▲':'triangle','■':'square','●':'circle','◆':'diamond','⬟':'pentagon','★':'star'};
   if(m)return paint({kind:'sequence',shapes:[...m[1]].filter(x=>map[x]).map(x=>map[x]).concat('?')});
  }
  if(t.includes('Pilihan bentuk:')){
   const m=[...t.matchAll(/(?:^|\s)[ABCD]\s*([▲■●◆⬟★])/g)].map(x=>x[1]);
   const map={'▲':'triangle','■':'square','●':'circle','◆':'diamond','⬟':'pentagon','★':'star'};
   if(m.length===4)return paint({kind:'odd',shapes:m.map(x=>map[x])});
  }
 }catch(e){console.warn('Visual IQ diagram rendering issue',e)}
 return '';
}
function answerDiagram(o){
 const t=o.text_ms||'',str=t.replace(/[^■□]/g,'');
 if(str.length===9)return window.PKSK_VISUAL_IQ?.paint({kind:'cells',mask:str.replace(/■/g,'1').replace(/□/g,'0')})||'';
 return '';
}
function stripped(q){const t=q.prompt_ms||'';return E(t.replace(/^\[Siri \d+\]\s*/,''))}
function seconds(){return Math.max(0,Math.floor((new Date(data.expires_at).getTime()-Date.now())/1000))}
function time(){const s=seconds();return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function clock(){const el=document.getElementById('time');if(el)el.textContent=time();if(data&&data.status==='in_progress'&&seconds()===0)submit(false)}
function landing(){
 clearInterval(timer);timer=null;data=null;
 app.innerHTML='<h2>Sedia untuk cabaran?</h2><p>10 soalan asli daripada bank IQ visual. <b>10 minit</b> dengan latihan yang mengutamakan soalan belum dicuba. Jawapan dan penerangan akan dipaparkan selepas dihantar.</p><p class="muted">Sila pastikan anda telah login menggunakan akaun pelajar PKSK Pro.</p><div class="actions"><button id="start" class="btn primary">🚀 Mula Visual IQ</button><a class="btn" href="/">Kembali ke Quiz Hub</a></div>';
 document.getElementById('start').onclick=start;
}
async function start(){
 if(busy)return;busy=true;setStatus('');const b=document.getElementById('start');if(b)b.disabled=true;
 try{
  const id=await rpc('start_visual_iq_quiz');localStorage.setItem(ACTIVE,id);
  await load(id);
 }catch(e){setStatus(e.message);if(b)b.disabled=false}finally{busy=false}
}
async function load(id){
 data=await rpc('get_practice_attempt_payload',{p_attempt_id:id});at=0;
 if(!data?.questions?.length)throw Error('Tiada soalan ditemui.');
 if(data.status!=='in_progress')return results(id);
 render();clearInterval(timer);timer=setInterval(clock,1000);
}
function render(){
 const q=data.questions[at],options=q.options||[],answered=data.questions.filter(x=>x.saved_answer?.selected_option_id).length;
 app.innerHTML='<div class="bars"><span class="pill">Soalan '+(at+1)+' / '+data.questions.length+' · '+E(q.difficulty||'')+'</span><span class="timer">⏱ <span id="time">'+time()+'</span></span></div>'
 +'<div class="nav">'+data.questions.map((x,i)=>'<button data-nav="'+i+'" class="'+(i===at?'here ':'')+(x.saved_answer?.selected_option_id?'done':'')+'" aria-label="Soalan '+(i+1)+'">'+(i+1)+'</button>').join('')+'</div>'
 +'<div class="question-title">'+stripped(q)+'</div><div class="diagram">'+diagram(q)+'</div>'
 +'<div class="answers">'+options.map(o=>'<button class="answer '+(q.saved_answer?.selected_option_id===o.id?'selected':'')+'" data-option="'+E(o.id)+'"><span class="key">'+E(o.key)+'</span><span class="choice">'+(answerDiagram(o)||E(o.text_ms||o.text_en))+'</span></button>').join('')+'</div>'
 +'<div class="actions"><button id="prev" class="btn" '+(at===0?'disabled':'')+'>← Sebelum</button><button id="next" class="btn" '+(at===data.questions.length-1?'disabled':'')+'>Seterusnya →</button><button id="send" class="btn warn">Hantar ('+answered+'/'+data.questions.length+')</button></div><p class="translation">Pilih satu jawapan. Anda boleh tukar pilihan sebelum menghantar.</p>';
 app.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{at=Number(b.dataset.nav);render()});
 app.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>save(b.dataset.option));
 document.getElementById('prev').onclick=()=>{at=Math.max(0,at-1);render()};
 document.getElementById('next').onclick=()=>{at=Math.min(data.questions.length-1,at+1);render()};
 document.getElementById('send').onclick=()=>submit(true);
}
async function save(optionId){
 if(busy||!data)return;busy=true;setStatus('');
 const q=data.questions[at],buttons=[...app.querySelectorAll('[data-option]')];buttons.forEach(b=>b.disabled=true);
 try{
  await rpc('save_practice_answer',{p_attempt_id:data.attempt_id,p_challenge_question_id:q.challenge_question_id,p_selected_option_id:optionId});
  q.saved_answer={selected_option_id:optionId};render();
 }catch(e){setStatus(e.message);buttons.forEach(b=>b.disabled=false)}finally{busy=false}
}
async function submit(confirmFirst){
 if(busy||!data||data.status!=='in_progress')return;
 if(confirmFirst&&!confirm('Hantar semua jawapan sekarang?'))return;
 busy=true;setStatus('Sedang menyemak jawapan…');
 try{await rpc('submit_practice_attempt',{p_attempt_id:data.attempt_id});await results(data.attempt_id)}
 catch(e){setStatus(e.message)}finally{busy=false}
}
async function results(id){
 clearInterval(timer);timer=null;
 const r=await rpc('get_practice_attempt_review',{p_attempt_id:id});
 localStorage.removeItem(ACTIVE);data=null;
 app.innerHTML='<h2>🏆 Keputusan Cabaran IQ Visual</h2><div class="score">'+Math.round(Number(r.percentage)||0)+'%</div><p><b>'+Number(r.correctCount||0)+' / '+Number(r.attemptedCount||0)+'</b> betul · '+Math.round(Number(r.elapsedSeconds||0)/60)+' minit</p>'
 +'<div class="actions"><button id="again" class="btn primary">Cuba Set Baharu</button><a class="btn" href="/">Quiz Hub</a></div>'
 +(r.questions||[]).map(q=>'<article class="card review-row '+(q.is_correct?'ok':'')+'"><b>Soalan '+q.position+' · '+(q.is_correct?'✓ Betul':'✕ Salah')+'</b><p>'+stripped(q)+'</p><div class="diagram">'+diagram(q)+'</div>'
 +(q.options||[]).map(o=>'<p><b>'+E(o.key)+'.</b> '+E(o.text_ms||o.text_en)+(o.id===q.correct_option_id?' <strong style="color:green">✓ Jawapan</strong>':'')+(o.id===q.selected_option_id?' <span class="pill">Pilihan anda</span>':'')+'</p>').join('')
 +'<p class="muted"><b>Penerangan:</b> '+E(q.explanation_ms||'')+'</p></article>').join('');
 document.getElementById('again').onclick=start;
 const analytics=document.createElement('section');
 analytics.className='card';
 analytics.innerHTML='<h3>📊 Analisis Kemahiran IQ</h3><p class="muted">Sedang mengira penguasaan mengikut jenis soalan…</p>';
 app.appendChild(analytics);
 rpc('get_my_visual_iq_progress').then(p=>{
  const categories=(p.categories||[]).slice().sort((a,b)=>a.percentage-b.percentage);
  const areas=categories.filter(x=>Number(x.total)>=2&&Number(x.percentage)<70).map(x=>x.name);
  analytics.innerHTML='<h3>📊 Analisis Kemahiran IQ</h3><p><b>Ketepatan keseluruhan: '+E(p.overallPercent)+'%</b> · '+Number(p.totalAnswered||0)+' soalan telah dicuba</p>'
   +categories.map(x=>'<p style="display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:7px 0;gap:10px"><span>'+E(x.name)+' <span class="muted">('+x.correct+'/'+x.total+')</span></span><b>'+Number(x.percentage)+'%</b></p>').join('')
   +(areas.length?'<p class="muted"><b>Fokus latihan seterusnya:</b> '+areas.map(E).join(', ')+'</p>':'<p class="muted">Teruskan latihan untuk mengesahkan penguasaan anda.</p>');
 }).catch(()=>{analytics.innerHTML='<p class="muted">Analisis terperinci belum tersedia; keputusan kuiz telah disimpan.</p>'});
 setStatus('');
}
async function boot(){
 landing();
 const existing=localStorage.getItem(ACTIVE);
 if(existing){try{await load(existing)}catch(e){localStorage.removeItem(ACTIVE);setStatus(e.message);landing()}}
}
boot();
})();
</script>
</body>
</html>
